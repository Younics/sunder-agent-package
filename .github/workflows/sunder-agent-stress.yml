name: Sunder Agent Stress

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      repetitions:
        description: Race and real-Docker repetitions
        required: true
        default: "3"
        type: string

permissions: {}

concurrency:
  group: sunder-agent-stress-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.100"
  MSBUILDDISABLENODEREUSE: "1"

jobs:
  stress:
    name: Repeated race and real-Docker stress
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout Agent repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sunder-agent-package
          persist-credentials: false

      - name: Checkout Core source SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Younics/sunder-core
          ref: main
          path: sunder-core
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore and build coordinated Agent sources
        working-directory: sunder-agent-package
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -er '.releaseVersion' packages.json)"
          dotnet restore Sunder.AgentPackage.slnx --force-evaluate -p:SunderUseSourceSdk=true
          dotnet build Sunder.AgentPackage.slnx -c Release --no-restore -m:1 \
            -p:SunderUseSourceSdk=true -p:SunderAgentVersion="$version" \
            -p:ContinuousIntegrationBuild=true

      - name: Repeat race and real-Docker selections
        id: stress_tests
        working-directory: sunder-agent-package
        shell: bash
        env:
          REPETITIONS: ${{ inputs.repetitions || '3' }}
          SUNDER_DOCKER_INTEGRATION: "1"
          SUNDER_REQUIRE_TEST_PREREQUISITES: "1"
        run: |
          set -uo pipefail
          [[ "$REPETITIONS" =~ ^([2-9]|1[0-9]|20)$ ]] || {
            echo "repetitions must be between 2 and 20." >&2
            echo "status=1" >> "$GITHUB_OUTPUT"
            exit 0
          }

          status=0
          # Keep the Linux stress lane skip-free; the excluded races are macOS- or Windows-only.
          race_filter='FullyQualifiedName~RaceTests&FullyQualifiedName!~Write_RejectsTemporaryNameSubstitutionBeforePublish&FullyQualifiedName!~WindowsFinalMutationHandles_BlockInPlaceEntryReplacement&FullyQualifiedName!~RecursiveDelete_RejectsCaseFoldedAliasOfNestedConfiguredRoot'
          mkdir -p artifacts/test-results
          for ((attempt = 1; attempt <= REPETITIONS; attempt++)); do
            results="$PWD/artifacts/test-results/race-$attempt"
            mkdir -p "$results"
            if ! dotnet test Sunder.AgentPackage.slnx -c Release --no-build --no-restore -m:1 \
              -p:SunderUseSourceSdk=true --filter "$race_filter" \
              --logger trx --results-directory "$results"; then
              status=1
            fi
          done

          project=tests/Sunder.Package.Agent.Tests/Sunder.Package.Agent.Tests.csproj
          test_fqn=Sunder.Package.Agent.Tests.WorkspaceTests.DockerExecutionTarget_RealDaemon_VerifiesMountAndContainerCanReadNestedHostCreation
          docker_discovered=true
          if ! discovered="$(dotnet test "$project" -c Release --no-build --no-restore -m:1 \
            -p:SunderUseSourceSdk=true --list-tests --filter "FullyQualifiedName=$test_fqn")"; then
            docker_discovered=false
            status=1
          elif ! grep -Fqx "    $test_fqn" <<< "$discovered"; then
            docker_discovered=false
            status=1
          fi

          if [[ "$docker_discovered" == true ]]; then
            for ((attempt = 1; attempt <= REPETITIONS; attempt++)); do
              results="$PWD/artifacts/test-results/docker-$attempt"
              mkdir -p "$results"
              if ! dotnet test "$project" -c Release --no-build --no-restore -m:1 \
                -p:SunderUseSourceSdk=true --filter "FullyQualifiedName=$test_fqn" \
                --logger trx --results-directory "$results"; then
                status=1
              fi
            done
          fi

          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Summarize stress evidence
        id: stress_summary
        if: always()
        working-directory: sunder-agent-package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/reports
          python3 scripts/test/generate-test-duration-report.py artifacts/test-results \
            --expected-skips 0 > artifacts/reports/stress-test-duration-report.json

      - name: Upload stress test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-agent-stress-tests
          path: |
            sunder-agent-package/artifacts/reports/stress-test-duration-report.json
            sunder-agent-package/artifacts/test-results/**/*.trx
          if-no-files-found: error
          retention-days: 30

      - name: Enforce stress evidence
        if: always()
        working-directory: sunder-agent-package
        shell: bash
        env:
          REPETITIONS: ${{ inputs.repetitions || '3' }}
          STRESS_STATUS: ${{ steps.stress_tests.outputs.status }}
          STRESS_SUMMARY_OUTCOME: ${{ steps.stress_summary.outcome }}
        run: |
          set -euo pipefail
          test "$STRESS_STATUS" = 0
          test "$STRESS_SUMMARY_OUTCOME" = success
          jq -e --argjson repetitions "$REPETITIONS" '
            .summary.failed == 0
            and .summary.skipped == 0
            and .summary.other == 0
            and .evidenceViolations == []
            and (.repeatedTests | length) > 0
            and all(.repeatedTests[]; .runs == $repetitions)
            and any(.repeatedTests[];
              (.test | contains("DockerExecutionTarget_RealDaemon_VerifiesMountAndContainerCanReadNestedHostCreation"))
              and .runs == $repetitions)
            and .flakeCandidates == []
          ' artifacts/reports/stress-test-duration-report.json >/dev/null
