name: Author a package lock input
run-name: Compose for lock authoring (not qualification)

on:
  workflow_dispatch:
    inputs:
      package:
        description: One import-free canonical package ID
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: agent-lock-authoring-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authoring:
    name: Compose without qualification or publication
    uses: ./.github/workflows/sunder-package-authoring.yml
    with:
      package: ${{ inputs.package }}
