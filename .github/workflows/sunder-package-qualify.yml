name: Qualify
run-name: ${{ inputs.operation == 'compose' && 'Compose for lock authoring (not qualification)' || 'Qualify' }}

on:
  workflow_dispatch:
    inputs:
      packages:
        description: Comma-separated canonical package IDs, or all for full qualification
        type: string
        default: all
      operation:
        description: Validate, or compose one import-free package for lock authoring
        type: choice
        options: [validate, compose]
        default: validate
      source:
        description: Exact branch commit to compose (required for compose)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: sunder-package-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  selection:
    name: Select explicit qualification inputs
    if: inputs.operation == 'validate'
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.selection.outputs.packages }}
      core_commit: ${{ steps.core.outputs.core_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: selection
        env:
          PACKAGES: ${{ inputs.packages }}
        run: python3 -B scripts/ci/version_selection.py --manual "$PACKAGES"
      - name: Resolve the declared Build release provenance
        id: core
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/ci/agent_ci.py coordinates

  baseline:
    name: Component and shared validation
    needs: selection
    uses: ./.github/workflows/sunder-package-smoke.yml
    permissions:
      contents: read
      actions: read
    with:
      packages: ${{ needs.selection.outputs.packages }}
      core_commit: ${{ needs.selection.outputs.core_commit }}
      package-tests: true

  authoring:
    name: Compose without qualification or publication
    if: inputs.operation == 'compose'
    uses: ./.github/workflows/sunder-package-authoring.yml
    with:
      package: ${{ inputs.packages }}
      source: ${{ inputs.source }}
