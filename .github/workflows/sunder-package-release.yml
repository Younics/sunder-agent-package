name: Sunder Agent Family Release

on:
  push:
    tags:
      - "agent/v*"

permissions: {}

concurrency:
  group: sunder-agent-family-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.100"
  MSBUILDDISABLENODEREUSE: "1"
  CORE_SDK_VERSION: "1.1.0"
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  NUGET_FLAT_CONTAINER: https://api.nuget.org/v3-flatcontainer

jobs:
  prepare:
    name: Resolve immutable Core and Agent release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      core_commit: ${{ steps.core.outputs.commit }}
      core_tag: ${{ steps.core.outputs.tag }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout Agent repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Validate family release tag and inventory
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^agent/v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?)$ ]]; then
            echo "Agent family releases must use agent/v<semver>." >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          if [[ "$version" == *-* ]]; then
            prerelease="${version#*-}"
            IFS='.' read -ra identifiers <<< "$prerelease"
            for identifier in "${identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && "$identifier" == 0* && "$identifier" != "0" ]]; then
                echo "Numeric SemVer prerelease identifiers must not contain leading zeroes." >&2
                exit 1
              fi
            done
          fi
          test "$version" = "$(jq -er '.releaseVersion' packages.json)" \
            || { echo "Release tag must match packages.json releaseVersion." >&2; exit 1; }
          [[ "$version" != 2.0.0-* ]] \
            || { echo "The Agent 2.0 baseline starts at stable 2.0.0." >&2; exit 1; }
          test "$(jq '[.packages[] | select(.artifactType == "sunderpkg")] | length' packages.json)" -eq 15 \
            || { echo "packages.json must contain exactly 15 primary runtime package projects." >&2; exit 1; }
          test "$(jq '[.packages[] | select(.artifactType == "nuget" and .packageId == "Sunder.Package.Agent.Protocol")] | length' packages.json)" -eq 1 \
            || { echo "packages.json must contain exactly one Agent Protocol package." >&2; exit 1; }

          is_prerelease=false
          dist_tag=latest
          if [[ "$version" == *-* ]]; then
            is_prerelease=true
            dist_tag=preview
          else
            unshipped="$(grep -Ev '^[[:space:]]*(#|$)' src/Sunder.Package.Agent.Contracts/PublicAPI.Unshipped.txt || true)"
            [[ -z "$unshipped" ]] \
              || { echo "Stable releases require a finalized Protocol API ledger." >&2; printf '%s\n' "$unshipped" >&2; exit 1; }
          fi
          {
            echo "dist_tag=$dist_tag"
            echo "is_prerelease=$is_prerelease"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve and verify final remote Core release
        id: core
        shell: bash
        run: |
          set -euo pipefail
          commit="$(bash scripts/release/verify-core-sdk-release.sh "$CORE_SDK_VERSION" resolve)"
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=sdk/v$CORE_SDK_VERSION" >> "$GITHUB_OUTPUT"

      - name: Fence release recovery to exact Agent and Core provenance
        shell: bash
        env:
          CORE_COMMIT: ${{ steps.core.outputs.commit }}
          CORE_TAG: ${{ steps.core.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/agent-release-state.json"
          encoded_tag="$(jq -rn --arg value "$GITHUB_REF_NAME" '$value | @uri')"
          status="$(curl --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$state" --write-out '%{http_code}' \
            "https://api.github.com/repos/$GH_REPO/releases/tags/$encoded_tag")"
          [[ "$status" == 404 ]] && exit 0
          [[ "$status" == 200 ]] || { echo "GitHub release lookup returned HTTP $status." >&2; exit 1; }
          provenance_url="$(jq -er '[.assets[] | select(.name == "release-provenance.json")] | if length == 1 then .[0].url else error("release must have one provenance asset") end' "$state")"
          provenance="$RUNNER_TEMP/release-provenance.json"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/octet-stream' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$provenance" "$provenance_url"
          jq -e \
            --arg agent_commit "$GITHUB_SHA" \
            --arg core_commit "$CORE_COMMIT" \
            --arg core_tag "$CORE_TAG" \
            --arg core_version "$CORE_SDK_VERSION" '
              .schemaVersion == 1
              and ([.sources[] | select(.name == "sunder-agent-package" and .sha == $agent_commit)] | length == 1)
              and ([.sources[] | select(.name == "sunder-core" and .sha == $core_commit)] | length == 1)
              and .materials == [{name: "sunder-core-sdk", tag: $core_tag, sha: $core_commit, packageVersion: $core_version}]
            ' "$provenance" >/dev/null \
            || { echo "Existing release provenance differs from this Agent tag or final Core release." >&2; exit 1; }

  source-verify:
    name: Locked remote-Core source and release-tool verification
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact Agent source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout exact Core fixture tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Younics/sunder-core
          ref: ${{ needs.prepare.outputs.core_commit }}
          path: sunder-core-fixture
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify release scripts and fixtures
        shell: bash
        env:
          EXPECTED_CORE_COMMIT: ${{ needs.prepare.outputs.core_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n scripts/*.sh scripts/release/*.sh
          bash scripts/release/verify-nuget-package.fixture.sh
          bash scripts/release/verify-core-sdk-release.fixture.sh
          bash scripts/release/publish-registry-package.fixture.sh
          bash scripts/release/promote-family-dist-tag.fixture.sh
          bash scripts/release/native-release.fixture.sh
          bash scripts/release/verify-core-sdk-release.sh "$CORE_SDK_VERSION" "$EXPECTED_CORE_COMMIT"

      - name: Restore, build, and test only final remote Core packages
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/release/verify-release-locks.sh "$CORE_SDK_VERSION"
          dotnet restore Sunder.AgentPackage.slnx --locked-mode \
            -p:SunderUseSourceSdk=false -p:RestoreLockedMode=true --source "$NUGET_SOURCE"
          dotnet build Sunder.AgentPackage.slnx -c Release --no-restore -m:1 \
            -p:SunderUseSourceSdk=false -p:SunderAgentVersion="$VERSION" \
            -p:ContinuousIntegrationBuild=true
          dotnet test Sunder.AgentPackage.slnx -c Release --no-build --no-restore -m:1 \
            -p:SunderUseSourceSdk=false

  native-leaves:
    name: Native signed leaves and Runtime lifecycle (${{ matrix.rid }})
    needs:
      - prepare
      - source-verify
    environment: sunder-agent-release-signing
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner_labels: ${{ vars.SUNDER_AGENT_RUNNER_WIN_X64 || '["windows-latest"]' }}
            signing: windows
          - rid: win-arm64
            runner_labels: ${{ vars.SUNDER_AGENT_RUNNER_WIN_ARM64 || '["windows-11-arm"]' }}
            signing: windows
          - rid: linux-x64
            runner_labels: ${{ vars.SUNDER_AGENT_RUNNER_LINUX_X64 || '["ubuntu-24.04"]' }}
            signing: none
          - rid: linux-arm64
            runner_labels: ${{ vars.SUNDER_AGENT_RUNNER_LINUX_ARM64 || '["ubuntu-24.04-arm"]' }}
            signing: none
          - rid: osx-x64
            runner_labels: ${{ vars.SUNDER_AGENT_RUNNER_OSX_X64 || '["macos-15-intel"]' }}
            signing: apple
          - rid: osx-arm64
            runner_labels: ${{ vars.SUNDER_AGENT_RUNNER_OSX_ARM64 || '["macos-14"]' }}
            signing: apple
    runs-on: ${{ fromJSON(matrix.runner_labels) }}
    steps:
      - name: Checkout exact Agent source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sunder-agent-package
          persist-credentials: false

      - name: Checkout Core provenance commit for the Runtime gate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Younics/sunder-core
          ref: ${{ needs.prepare.outputs.core_commit }}
          path: sunder-core
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify exact source and final remote package locks
        working-directory: sunder-agent-package
        shell: bash
        env:
          EXPECTED_CORE_COMMIT: ${{ needs.prepare.outputs.core_commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C ../sunder-core rev-parse HEAD)" = "$EXPECTED_CORE_COMMIT"
          bash scripts/release/verify-release-locks.sh "$CORE_SDK_VERSION"

      - name: Azure login for native Windows apphost signing
        if: matrix.signing == 'windows'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Azure Trusted Signing for worker apphosts
        if: matrix.signing == 'windows'
        shell: pwsh
        env:
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT || secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME || secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME || secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          WINDOWS_PUBLISHER_SUBJECT: ${{ vars.WINDOWS_PUBLISHER_SUBJECT || secrets.WINDOWS_PUBLISHER_SUBJECT }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("AZURE_TRUSTED_SIGNING_ENDPOINT", "AZURE_TRUSTED_SIGNING_ACCOUNT_NAME", "AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME", "WINDOWS_PUBLISHER_SUBJECT")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Signing value '$name' is required." }
          }
          $package = Join-Path $env:RUNNER_TEMP "artifact-signing-client.1.0.128.nupkg"
          $root = Join-Path $env:RUNNER_TEMP "artifact-signing-client"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/1.0.128/microsoft.artifactsigning.client.1.0.128.nupkg" -OutFile $package
          if ((Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash -ne "74BD7D27E6CE1051409C38D9B46BC8DF0400ECD643D51FFBF2AC00869061E40B") { throw "Artifact Signing client digest validation failed." }
          Expand-Archive -LiteralPath $package -DestinationPath $root
          $dlib = Get-ChildItem -Path $root -Filter Azure.CodeSigning.Dlib.dll -Recurse | Where-Object { $_.FullName -match "[\\/]x64[\\/]" } | Select-Object -First 1
          if ($null -eq $dlib) { throw "Azure.CodeSigning.Dlib.dll was not found." }
          $metadataPath = Join-Path $env:RUNNER_TEMP "trusted-signing-metadata.json"
          [ordered]@{
            Endpoint = $env:AZURE_TRUSTED_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:AZURE_TRUSTED_SIGNING_ACCOUNT_NAME
            CertificateProfileName = $env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME
            CorrelationId = "sunder-agent-${{ github.run_id }}-${{ matrix.rid }}"
            ExcludeCredentials = @("EnvironmentCredential", "ManagedIdentityCredential", "SharedTokenCacheCredential", "VisualStudioCredential", "VisualStudioCodeCredential", "AzurePowerShellCredential", "AzureDeveloperCliCredential", "InteractiveBrowserCredential")
          } | ConvertTo-Json -Depth 4 | Out-File -FilePath $metadataPath -Encoding utf8
          "SUNDER_WINDOWS_SIGN_DLIB=$($dlib.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SUNDER_WINDOWS_SIGN_METADATA=$metadataPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SUNDER_WINDOWS_PUBLISHER_SUBJECT=$env:WINDOWS_PUBLISHER_SUBJECT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure Developer ID signing for native macOS apphosts
        if: matrix.signing == 'apple'
        shell: bash
        env:
          APPLE_BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_BUILD_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_SIGNING_KEYCHAIN_PASSWORD }}
          APPLE_SIGN_APP_IDENTITY: ${{ secrets.APPLE_SIGN_APP_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_BUILD_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_KEYCHAIN_PASSWORD APPLE_SIGN_APP_IDENTITY APPLE_TEAM_ID; do
            [[ -n "${!name:-}" ]] || { echo "Signing secret '$name' is required." >&2; exit 1; }
          done
          certificate="$RUNNER_TEMP/apple-build-certificate.p12"
          keychain="$RUNNER_TEMP/sunder-agent-signing.keychain-db"
          prior_keychains="$RUNNER_TEMP/sunder-agent-prior-keychains.txt"
          prior_keychains_pending="$prior_keychains.pending"
          {
            echo "SUNDER_APPLE_SIGNING_CERTIFICATE=$certificate"
            echo "SUNDER_APPLE_SIGNING_KEYCHAIN=$keychain"
            echo "SUNDER_APPLE_PRIOR_KEYCHAINS=$prior_keychains"
            echo "SUNDER_APPLE_SIGN_IDENTITY=$APPLE_SIGN_APP_IDENTITY"
            echo "SUNDER_APPLE_TEAM_ID=$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"
          restore_user_keychains() {
            [[ -f "$prior_keychains" ]] || return 0
            local entry
            local -a entries=()
            while IFS= read -r entry; do
              entry="${entry#"${entry%%[![:space:]]*}"}"
              entry="${entry#\"}"
              entry="${entry%\"}"
              [[ -z "$entry" ]] || entries+=("$entry")
            done < "$prior_keychains"
            security list-keychains -d user -s "${entries[@]}"
          }
          cleanup_signing() {
            local status="$1"
            trap - ERR
            restore_user_keychains || true
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -f "$certificate" "$keychain" "$prior_keychains" "$prior_keychains_pending" || true
            exit "$status"
          }
          trap 'cleanup_signing $?' ERR
          security list-keychains -d user > "$prior_keychains_pending"
          mv "$prior_keychains_pending" "$prior_keychains"
          if ! printf '%s' "$APPLE_BUILD_CERTIFICATE_BASE64" | base64 --decode > "$certificate" 2>/dev/null; then
            printf '%s' "$APPLE_BUILD_CERTIFICATE_BASE64" | base64 -D > "$certificate"
          fi
          security create-keychain -p "$APPLE_SIGNING_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$APPLE_SIGNING_KEYCHAIN_PASSWORD" "$keychain"
          current_keychains=()
          while IFS= read -r entry; do
            entry="${entry#"${entry%%[![:space:]]*}"}"
            entry="${entry#\"}"
            entry="${entry%\"}"
            [[ -z "$entry" ]] || current_keychains+=("$entry")
          done < "$prior_keychains"
          security list-keychains -d user -s "$keychain" "${current_keychains[@]}"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_SIGNING_KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          rm -f "$certificate"
          trap - ERR

      - name: Build exactly 15 native leaves through the pre-index signing target
        working-directory: sunder-agent-package
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: ./scripts/release/build-native-family.ps1 -Rid "${{ matrix.rid }}" -Version $env:VERSION -OutputDirectory "artifacts/native-build/${{ matrix.rid }}"

      - name: Exercise all native workers and Core release budgets
        working-directory: sunder-agent-package
        shell: bash
        env:
          EXPECTED_CORE_COMMIT: ${{ needs.prepare.outputs.core_commit }}
        run: |
          bash scripts/release/run-native-runtime-smoke.sh \
            ../sunder-core \
            "artifacts/native-build/${{ matrix.rid }}/current-rid-archives" \
            "artifacts/native-build/${{ matrix.rid }}/metrics" \
            "$EXPECTED_CORE_COMMIT"

      - name: Record exact signed leaf, lifecycle, and metric evidence
        working-directory: sunder-agent-package
        shell: bash
        env:
          CORE_COMMIT: ${{ needs.prepare.outputs.core_commit }}
          CORE_TAG: ${{ needs.prepare.outputs.core_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bash scripts/release/record-native-leaf-evidence.sh \
            "${{ matrix.rid }}" "$VERSION" "$GITHUB_SHA" "$CORE_TAG" "$CORE_COMMIT" "$CORE_SDK_VERSION" \
            "artifacts/native-build/${{ matrix.rid }}/current-rid-archives" \
            "artifacts/native-build/${{ matrix.rid }}/metrics" \
            "artifacts/native/${{ matrix.rid }}" "$PWD"

      - name: Upload exact native leaves and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-agent-native-leaves-${{ matrix.rid }}
          path: sunder-agent-package/artifacts/native/${{ matrix.rid }}/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Remove temporary Apple signing keychain
        if: always() && matrix.signing == 'apple'
        shell: bash
        run: |
          set -uo pipefail
          cleanup_status=0
          if [[ -f "${SUNDER_APPLE_PRIOR_KEYCHAINS:-}" ]]; then
            prior_keychains=()
            while IFS= read -r entry; do
              entry="${entry#"${entry%%[![:space:]]*}"}"
              entry="${entry#\"}"
              entry="${entry%\"}"
              [[ -z "$entry" ]] || prior_keychains+=("$entry")
            done < "$SUNDER_APPLE_PRIOR_KEYCHAINS"
            security list-keychains -d user -s "${prior_keychains[@]}" || cleanup_status=1
          fi
          if [[ -n "${SUNDER_APPLE_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$SUNDER_APPLE_SIGNING_KEYCHAIN" >/dev/null 2>&1 \
              || [[ ! -e "$SUNDER_APPLE_SIGNING_KEYCHAIN" ]] \
              || cleanup_status=1
          fi
          rm -f \
            "${SUNDER_APPLE_SIGNING_CERTIFICATE:-}" \
            "${SUNDER_APPLE_SIGNING_KEYCHAIN:-}" \
            "${SUNDER_APPLE_PRIOR_KEYCHAINS:-}" \
            "${SUNDER_APPLE_PRIOR_KEYCHAINS:-}.pending" \
            || cleanup_status=1
          exit "$cleanup_status"

  fan-in:
    name: Fan in tested native leaves and verify immutable family
    needs:
      - prepare
      - native-leaves
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact Agent source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sunder-agent-package
          persist-credentials: false

      - name: Checkout exact Core provenance commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Younics/sunder-core
          ref: ${{ needs.prepare.outputs.core_commit }}
          path: sunder-core
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download every exact native leaf artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sunder-agent-native-leaves-*
          path: native-input
          merge-multiple: true

      - name: Compose signed leaves without rebuilding project references
        working-directory: sunder-agent-package
        shell: bash
        env:
          CORE_COMMIT: ${{ needs.prepare.outputs.core_commit }}
          CORE_TAG: ${{ needs.prepare.outputs.core_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C ../sunder-core rev-parse HEAD)" = "$CORE_COMMIT"
          bash scripts/release/verify-release-locks.sh "$CORE_SDK_VERSION"
          bash scripts/release/assemble-native-family.sh \
            ../native-input artifacts/family "$VERSION" "$GITHUB_SHA" \
            "$CORE_TAG" "$CORE_COMMIT" "$CORE_SDK_VERSION" "$PWD"

      - name: Verify final inventory, budgets, native SQLite, and signed apphost identity
        working-directory: sunder-agent-package
        shell: bash
        env:
          CORE_COMMIT: ${{ needs.prepare.outputs.core_commit }}
          CORE_TAG: ${{ needs.prepare.outputs.core_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          output=artifacts/family
          evidence="$output/native-test-evidence.json"
          runtime_count="$(jq '[.packages[] | select(.artifactType == "sunderpkg")] | length' packages.json)"
          test "$runtime_count" -eq 15
          test "$(find "$output" -maxdepth 1 -name '*.sunderpkg' -type f | wc -l)" -eq 15
          test -f "$output/Sunder.Package.Agent.Protocol.$VERSION.nupkg"
          jq -e \
            --arg version "$VERSION" --arg agent "$GITHUB_SHA" \
            --arg core_tag "$CORE_TAG" --arg core_commit "$CORE_COMMIT" --arg core_version "$CORE_SDK_VERSION" '
              .schemaVersion == 1 and .version == $version and .agentCommit == $agent
              and .core == {tag: $core_tag, commit: $core_commit, packageVersion: $core_version}
              and ([.nativeRuns[].rid] | sort) == ["linux-arm64","linux-x64","osx-arm64","osx-x64","win-arm64","win-x64"]
              and all(.nativeRuns[]; .packages | length == 15)
              and (.finalArtifacts | length == 16)
            ' "$evidence" >/dev/null

          max_runtime_archive_bytes=$((256 * 1024 * 1024))
          max_runtime_payload_bytes=$((640 * 1024 * 1024))
          max_protocol_archive_bytes=$((16 * 1024 * 1024))
          max_family_archive_bytes=$((4 * 1024 * 1024 * 1024))
          protocol="$output/Sunder.Package.Agent.Protocol.$VERSION.nupkg"
          protocol_bytes="$(wc -c < "$protocol" | tr -d '[:space:]')"
          (( protocol_bytes > 0 && protocol_bytes <= max_protocol_archive_bytes ))
          family_bytes="$protocol_bytes"
          while IFS=$'\t' read -r package_id provider_ids; do
            archive="$output/$package_id.$VERSION.sunderpkg"
            manifest="$RUNNER_TEMP/$package_id-manifest.json"
            index="$RUNNER_TEMP/$package_id-content-index.json"
            unzip -p "$archive" manifest/sunder-package.json > "$manifest"
            unzip -p "$archive" manifest/content-index.json > "$index"
            archive_bytes="$(wc -c < "$archive" | tr -d '[:space:]')"
            payload_bytes="$(jq -er '[.files[].size] | add // 0' "$index")"
            (( archive_bytes > 0 && archive_bytes <= max_runtime_archive_bytes ))
            (( payload_bytes > 0 && payload_bytes <= max_runtime_payload_bytes ))
            family_bytes=$((family_bytes + archive_bytes))
            jq --argjson provider_ids "$provider_ids" -e '
              def rids: ["linux-arm64","linux-x64","osx-arm64","osx-x64","win-arm64","win-x64"];
              ([.targets[] | select(.role == "runtime") | .rid] | sort) == rids
              and (([.targets[] | select(.role == "app") | .rid] | sort) as $apps | $apps == [] or $apps == rids)
              and all(.targets[] | select(.role == "runtime"); .kind == "worker" and (.requiredHostCapabilities | index("worker-protocol.v3") != null))
              and ([.provides[].providerId] | sort) == ($provider_ids | sort)
            ' "$manifest" >/dev/null
            if [[ "$package_id" == "sunder.package.agent.memory.semantic" ]]; then
              jq -e '
                ([.files[].path | select(test("payload/runtime/(win-(x64|arm64)/lib/e_sqlite3\\.dll|osx-(x64|arm64)/lib/libe_sqlite3\\.dylib|linux-(x64|arm64)/lib/libe_sqlite3\\.so)$"))] | length) == 6
                and ([.files[].path | select(. == "payload/runtime/shared/lib/SQLitePCLRaw.provider.e_sqlite3.dll")] | length) == 1
              ' "$index" >/dev/null
            fi
          done < <(jq -r '.packages | map(select(.artifactType == "sunderpkg")) | sort_by(.key)[] | [.packageId, (.providerIds | tojson)] | @tsv' packages.json)
          (( family_bytes <= max_family_archive_bytes ))

          while IFS=$'\t' read -r artifact expected_sha expected_size; do
            path="$output/$artifact"
            test -f "$path"
            test "$(sha256sum "$path" | cut -d ' ' -f 1)" = "$expected_sha"
            test "$(wc -c < "$path" | tr -d '[:space:]')" = "$expected_size"
          done < <(jq -r '.finalArtifacts[] | [.path, .sha256, (.size | tostring)] | @tsv' "$evidence")
          while IFS=$'\t' read -r rid package_id apphost_path expected_sha signature_kind; do
            archive="$output/$package_id.$VERSION.sunderpkg"
            actual_sha="$(unzip -p "$archive" "$apphost_path" | sha256sum | cut -d ' ' -f 1)"
            test "$actual_sha" = "$expected_sha"
            case "$rid" in
              win-*) test "$signature_kind" = authenticode ;;
              osx-*) test "$signature_kind" = apple ;;
              linux-*) test "$signature_kind" = none ;;
            esac
          done < <(jq -r '.nativeRuns[] | .rid as $rid | .packages[] | [$rid, .packageId, .leaf.appHostPath, .leaf.appHostSha256, .leaf.signatureKind] | @tsv' "$evidence")

      - name: Build exact Core validation paths
        working-directory: sunder-core
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore languages/csharp/dotnet/host/Sunder.Cli/Sunder.Cli.csproj --locked-mode
          dotnet restore languages/csharp/dotnet/tests/Sunder.Runtime.Host.Tests/Sunder.Runtime.Host.Tests.csproj --locked-mode
          dotnet restore languages/csharp/dotnet/tests/Sunder.App.Tests/Sunder.App.Tests.csproj --locked-mode
          dotnet build languages/csharp/dotnet/host/Sunder.Cli/Sunder.Cli.csproj -c Release --no-restore
          dotnet build languages/csharp/dotnet/tests/Sunder.Runtime.Host.Tests/Sunder.Runtime.Host.Tests.csproj -c Release --no-restore
          dotnet build languages/csharp/dotnet/tests/Sunder.App.Tests/Sunder.App.Tests.csproj -c Release --no-restore

      - name: Validate exact immutable archives through Package Format
        working-directory: sunder-agent-package
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r archive; do
            dotnet ../sunder-core/languages/csharp/dotnet/host/Sunder.Cli/bin/Release/net10.0/sunder.dll dev package validate "$archive"
          done < <(find artifacts/family -maxdepth 1 -name '*.sunderpkg' -type f | sort)

      - name: Re-run complete final family lifecycle and produce App snapshot
        working-directory: sunder-core
        shell: bash
        env:
          SUNDER_AGENT_PACKAGE_ARCHIVE_DIR: ${{ github.workspace }}/sunder-agent-package/artifacts/family
          SUNDER_AGENT_UI_SNAPSHOT_DIR: ${{ github.workspace }}/agent-ui-snapshot
        run: |
          set -euo pipefail
          mkdir -p "$SUNDER_AGENT_UI_SNAPSHOT_DIR"
          test_fqn="Sunder.Runtime.Host.Tests.AgentPackageReleaseSmokeTests.ReleaseArchives_InstallActivateUnloadReloadAndReinstallAsOneFamily"
          discovered="$(dotnet test languages/csharp/dotnet/tests/Sunder.Runtime.Host.Tests/Sunder.Runtime.Host.Tests.csproj -c Release --no-build --no-restore --list-tests --filter "FullyQualifiedName=$test_fqn")"
          grep -Fqx "    $test_fqn" <<< "$discovered"
          dotnet test languages/csharp/dotnet/tests/Sunder.Runtime.Host.Tests/Sunder.Runtime.Host.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName=$test_fqn"

      - name: Activate Runtime-produced snapshot in the real App host
        working-directory: sunder-core
        shell: bash
        env:
          SUNDER_AGENT_UI_SNAPSHOT_DIR: ${{ github.workspace }}/agent-ui-snapshot
        run: |
          set -euo pipefail
          test_fqn="Sunder.App.Tests.AgentPackageReleaseSmokeTests.RuntimeProducedAgentSnapshot_MaterializesAndActivatesInApp"
          discovered="$(dotnet test languages/csharp/dotnet/tests/Sunder.App.Tests/Sunder.App.Tests.csproj -c Release --no-build --no-restore --list-tests --filter "FullyQualifiedName=$test_fqn")"
          grep -Fqx "    $test_fqn" <<< "$discovered"
          dotnet test languages/csharp/dotnet/tests/Sunder.App.Tests/Sunder.App.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName=$test_fqn"

      - name: Upload exact tested family and native evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-agent-family-release
          path: sunder-agent-package/artifacts/family/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish exact tested family and promote dist tags
    needs:
      - prepare
      - fan-in
    runs-on: ubuntu-latest
    concurrency:
      group: sunder-agent-family-dist-tag-promotion
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout exact Agent source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download only the exact tested fan-in artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sunder-agent-family-release
          path: release-assets

      - name: Publish immutable versions, then promote the tested family
        shell: bash
        env:
          CORE_COMMIT: ${{ needs.prepare.outputs.core_commit }}
          CORE_TAG: ${{ needs.prepare.outputs.core_tag }}
          DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          REGISTRY_API_URL: ${{ vars.SUNDER_REGISTRY_API_URL }}
          SUNDER_REGISTRY_CLI_TOKEN: ${{ secrets.SUNDER_REGISTRY_CLI_TOKEN }}
          SUNDER_REGISTRY_PUBLISH_TOKEN: ${{ secrets.SUNDER_REGISTRY_PUBLISH_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/release/publish-agent-family.sh release-assets
