name: Sunder Agent Package Release

on:
  push:
    tags:
      - "agent*/v*"

permissions: {}

concurrency:
  group: sunder-agent-package-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.100"
  MSBUILDDISABLENODEREUSE: "1"

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
      package_id: ${{ steps.release.outputs.package_id }}
      project_path: ${{ steps.release.outputs.project_path }}
      release_title: ${{ steps.release.outputs.release_title }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^([a-z0-9-]+)/v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
            echo "Sunder Agent package release tags must use '<package>/v<semver>', for example agent/v0.8.0 or agent-provider-openai/v0.8.0-beta.1." >&2
            exit 1
          fi

          package_key="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"

          package="$(jq -cer --arg key "$package_key" '.packages[] | select(.key == $key and .artifactType == "sunderpkg")' packages.json)" \
            || { echo "Unsupported Sunder Agent package release tag prefix '$package_key'." >&2; exit 1; }
          release_version="$(jq -er '.releaseVersion' packages.json)"
          if [[ "$version" != "$release_version" ]]; then
            echo "Release tag version '$version' must match packages.json releaseVersion '$release_version'." >&2
            exit 1
          fi
          project_path="$(jq -r '.projectPath' <<< "$package")"
          package_id="$(jq -r '.packageId' <<< "$package")"
          release_title="$(jq -r '.releaseTitle' <<< "$package")"
          artifact_name="$(jq -r '.artifactName' <<< "$package")"

          is_prerelease="false"
          if [[ "$version" == *-* ]]; then
            is_prerelease="true"
          fi

          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"
          echo "package_id=$package_id" >> "$GITHUB_OUTPUT"
          echo "project_path=$project_path" >> "$GITHUB_OUTPUT"
          echo "release_title=$release_title" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  package:
    name: Package .sunderpkg
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore packages
        shell: bash
        run: dotnet restore Sunder.AgentPackage.slnx --locked-mode -p:SunderUseSourceSdk=false

      - name: Build solution
        shell: bash
        run: dotnet build Sunder.AgentPackage.slnx -c Release --no-restore -m:1 -p:SunderUseSourceSdk=false -p:Version=${{ needs.prepare.outputs.version }} -p:InformationalVersion=${{ needs.prepare.outputs.version }} -p:ContinuousIntegrationBuild=true

      - name: Test solution
        shell: bash
        run: dotnet test Sunder.AgentPackage.slnx -c Release --no-build --no-restore -p:SunderUseSourceSdk=false

      - name: Shutdown build servers
        shell: bash
        run: dotnet build-server shutdown

      - name: Publish package archive
        shell: bash
        env:
          PROJECT_PATH: ${{ needs.prepare.outputs.project_path }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          release_dir="$PWD/artifacts/release"
          output_path="$release_dir/${{ needs.prepare.outputs.package_id }}.$VERSION.sunderpkg"
          if [[ -e "$output_path" ]]; then
            echo "Refusing to overwrite immutable release artifact '$output_path'." >&2
            exit 1
          fi

          dotnet msbuild "$PROJECT_PATH" \
            -t:PackSunderPackage \
            -m:1 \
            -p:Configuration=Release \
            -p:Version="$VERSION" \
            -p:InformationalVersion="$VERSION" \
            -p:ContinuousIntegrationBuild=true \
            -p:SunderUseSourceSdk=false \
            -p:SunderPackageOutputPath="$output_path"

          shopt -s nullglob
          packages=("$release_dir"/*.sunderpkg)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "Expected exactly one .sunderpkg in '$release_dir', found ${#packages[@]}." >&2
            exit 1
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs:
      - prepare
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
          RELEASE_TITLE: ${{ needs.prepare.outputs.release_title }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          tag="${GITHUB_REF_NAME}"
          artifact_dir="release-assets/${{ needs.prepare.outputs.artifact_name }}"
          bash scripts/generate-release-evidence.sh "$artifact_dir" "sunder-agent-package=$GITHUB_SHA"
          assets=("$artifact_dir"/*)
          if [[ ${#assets[@]} -lt 5 ]]; then
            echo "No Sunder package release assets were downloaded." >&2
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release '$tag' already exists; immutable release assets cannot be overwritten." >&2
            exit 1
          fi

          create_args=(
            release create "$tag"
            --title "$RELEASE_TITLE $VERSION"
            --notes "Automated $RELEASE_TITLE package release for $VERSION."
          )

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            create_args+=(--prerelease)
          fi

          gh "${create_args[@]}" "${assets[@]}"
