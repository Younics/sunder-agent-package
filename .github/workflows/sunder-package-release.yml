name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}
concurrency:
  group: sunder-agent-family
  cancel-in-progress: false
env:
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  prepare:
    name: Select versions
    if: github.repository == 'Younics/sunder-agent-package' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: sunder-agent-release-promotion
    permissions:
      # GitHub exposes drafts only with push access. Planning itself is read-only,
      # and no toolchain or build executes in this job.
      contents: write
    outputs:
      selected_count: ${{ steps.selection.outputs.selected_count }}
      resume: ${{ steps.selection.outputs.resume }}
      packages: ${{ steps.selection.outputs.packages }}
      plan_sha256: ${{ steps.selection.outputs.plan_sha256 }}
      core_commit: ${{ steps.release.outputs.core_commit }}
      core_tag: ${{ steps.release.outputs.core_tag }}
      core_version: ${{ steps.release.outputs.core_version }}
      matrix: ${{ steps.matrix.outputs.native }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: matrix
        env:
          RUNNER_VARIABLES: ${{ toJSON(vars) }}
        run: python3 -B scripts/ci/agent_ci.py matrices
      - name: Compare authored versions against published releases
        id: selection
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_API_URL: ${{ vars.SUNDER_REGISTRY_API_URL }}
        run: python3 -B scripts/release/agent_selection.py plan --plan artifacts/release-plan.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-release-selection
          path: artifacts/release-plan.json
          if-no-files-found: error
          retention-days: 90
      - name: Resolve the declared Core build-tool release
        if: steps.selection.outputs.selected_count != '0'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$GITHUB_REF_PROTECTED" = true
          python3 -B scripts/ci/agent_ci.py coordinates

  validation:
    name: Validate selected packages
    needs: prepare
    if: needs.prepare.outputs.selected_count != '0' && needs.prepare.outputs.resume != 'true'
    uses: ./.github/workflows/sunder-package-smoke.yml
    permissions:
      contents: read
    with:
      core_commit: ${{ needs.prepare.outputs.core_commit }}
      package-tests: ${{ needs.prepare.outputs.selected_count != '0' }}
      packages: ${{ needs.prepare.outputs.packages }}

  native:
    name: Package · ${{ matrix.rid }}
    needs: [prepare, validation]
    if: needs.prepare.outputs.selected_count != '0' && needs.prepare.outputs.resume != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      CORE_COMMIT: ${{ needs.prepare.outputs.core_commit }}
      CORE_TAG: ${{ needs.prepare.outputs.core_tag }}
      CORE_BUILD_VERSION: ${{ needs.prepare.outputs.core_version }}
      VERSION: ${{ github.workspace }}/sunder-agent-package/artifacts/release-plan.json
      SUNDER_AGENT_RETAINED_ARCHIVE_DIR: ${{ github.workspace }}/sunder-agent-package/artifacts/retained-agent-archives
    defaults:
      run:
        working-directory: sunder-agent-package
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sunder-agent-package
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Younics/sunder-core
          ref: ${{ needs.prepare.outputs.core_commit }}
          path: sunder-core
          persist-credentials: false
      - uses: ./sunder-agent-package/.github/actions/setup
        with:
          node: 'false'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-release-selection
          path: sunder-agent-package/artifacts
      - name: Verify release locks and download native inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/release/verify-release-locks.sh
          test "$(python3 -B scripts/release/agent_release.py file-sha "$VERSION")" = "${{ needs.prepare.outputs.plan_sha256 }}"
          python3 -B scripts/release/agent_selection.py retain --plan "$VERSION" --directory "$SUNDER_AGENT_RETAINED_ARCHIVE_DIR"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-dependency-inputs
          path: ${{ runner.temp }}/release-inputs
      - name: Verify shared dependency inventory
        env:
          INPUTS_SHA256: ${{ needs.validation.outputs.inputs_sha256 }}
        run: test "$(python3 -B scripts/release/agent_release.py file-sha "$RUNNER_TEMP/release-inputs/cold-inputs.json")" = "$INPUTS_SHA256"
      - name: Build and qualify only version-selected native leaves
        shell: pwsh
        run: |
          ./scripts/release/build-native-family.ps1 -Rid "${{ matrix.rid }}" -Version $env:VERSION `
            -OutputDirectory "artifacts/native-build/${{ matrix.rid }}" -InputsDirectory "$env:RUNNER_TEMP/release-inputs"
      - name: Exercise actual native Workers and retain qualified role bytes
        env:
          RID: ${{ matrix.rid }}
        run: |
          set -euo pipefail
          bash scripts/release/run-native-runtime-smoke.sh ../sunder-core "artifacts/native-build/$RID/current-rid-archives" "artifacts/native-build/$RID/metrics" "$CORE_COMMIT"
          python3 -B scripts/release/native-family.py record "$RID" "$VERSION" "$GITHUB_SHA" "$CORE_TAG" "$CORE_COMMIT" "$CORE_BUILD_VERSION" \
            "artifacts/native-build/$RID/current-rid-archives" "artifacts/native-build/$RID/metrics" "artifacts/native/$RID" "$PWD"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-agent-native-${{ matrix.rid }}
          path: sunder-agent-package/artifacts/native/${{ matrix.rid }}/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  fan-in:
    name: Assemble and verify family
    needs: [prepare, validation, native]
    if: needs.prepare.outputs.selected_count != '0' && needs.prepare.outputs.resume != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      CORE_COMMIT: ${{ needs.prepare.outputs.core_commit }}
      CORE_TAG: ${{ needs.prepare.outputs.core_tag }}
      CORE_BUILD_VERSION: ${{ needs.prepare.outputs.core_version }}
      VERSION: ${{ github.workspace }}/sunder-agent-package/artifacts/release-plan.json
      SUNDER_AGENT_RETAINED_ARCHIVE_DIR: ${{ github.workspace }}/sunder-agent-package/artifacts/retained-agent-archives
    defaults:
      run:
        working-directory: sunder-agent-package
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sunder-agent-package
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Younics/sunder-core
          ref: ${{ needs.prepare.outputs.core_commit }}
          path: sunder-core
          persist-credentials: false
      - uses: ./sunder-agent-package/.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sunder-agent-native-*
          path: native-input
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-release-selection
          path: sunder-agent-package/artifacts
      - name: Prepare dependencies, then compose without rebuilding qualified leaves
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(python3 -B scripts/release/agent_release.py file-sha "$VERSION")" = "${{ needs.prepare.outputs.plan_sha256 }}"
          python3 -B scripts/release/agent_selection.py retain --plan "$VERSION" --directory "$SUNDER_AGENT_RETAINED_ARCHIVE_DIR"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-dependency-inputs
          path: ${{ runner.temp }}/release-inputs
      - name: Compose tested native bytes with the shared exact dependencies
        env:
          INPUTS_SHA256: ${{ needs.validation.outputs.inputs_sha256 }}
        run: |
          set -euo pipefail
          test "$(python3 -B scripts/release/agent_release.py file-sha "$RUNNER_TEMP/release-inputs/cold-inputs.json")" = "$INPUTS_SHA256"
          python3 -B scripts/ci/agent_ci.py prepare --core ../sunder-core --inputs "$RUNNER_TEMP/release-inputs" --work "$RUNNER_TEMP/fanin" --mode package
          python3 -B scripts/ci/agent_ci.py run --state "$RUNNER_TEMP/fanin/ci-state.json" -- \
            python3 -B scripts/release/native-family.py assemble ../native-input artifacts/family "$VERSION" "$GITHUB_SHA" "$CORE_TAG" "$CORE_COMMIT" "$CORE_BUILD_VERSION" "$PWD"
          python3 -B scripts/release/native-family.py verify artifacts/family/native-test-evidence.json artifacts/family packages.json "$VERSION" "$GITHUB_SHA" "$CORE_TAG" "$CORE_COMMIT" "$CORE_BUILD_VERSION"
          cp "$VERSION" artifacts/family/release-plan.json
          bash scripts/release/generate-package-output-audit.sh artifacts/family artifacts/family/native-test-evidence.json "$PWD" artifacts/family/package-output-audit.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-package-test-binaries
          path: sunder-agent-package/artifacts/package-test-binaries
      - name: Inspect exact archives with the previously built Agent contract tests
        id: archive_tests
        env:
          SUNDER_REQUIRE_TEST_PREREQUISITES: "1"
          SUNDER_AGENT_PACKAGE_ARCHIVE_DIR: ${{ github.workspace }}/sunder-agent-package/artifacts/family
          SUNDER_AGENT_PACKAGE_OUTPUT_AUDIT_REQUIRED: "1"
        run: >-
          dotnet vstest artifacts/package-test-binaries/Sunder.Package.Agent.Tests.dll
          --TestCaseFilter:FullyQualifiedName~PackageFamilyArchiveContractTests --Logger:trx --ResultsDirectory:artifacts/family-results/agent
      - name: Require executed Agent archive assertions
        if: always() && (steps.archive_tests.outcome == 'success' || steps.archive_tests.outcome == 'failure')
        run: python3 scripts/test/generate-test-duration-report.py artifacts/family-results/agent --expected-skips 0
      - name: Build Core validation paths
        working-directory: sunder-core
        run: |
          dotnet restore Sunder.Core.slnx --locked-mode
          dotnet build Sunder.Core.slnx -c Release --no-restore -p:GeneratePackageOnBuild=false
      - name: Validate and exercise exact family bytes through Runtime and App
        run: python3 -B scripts/ci/agent_ci.py test-family --core ../sunder-core --directory artifacts/family
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-agent-family-release
          path: sunder-agent-package/artifacts/family/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Retain family test results
        if: always() && (steps.archive_tests.outcome == 'success' || steps.archive_tests.outcome == 'failure' || steps.archive_tests.outcome == 'cancelled')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-family-results-${{ github.run_attempt }}
          path: sunder-agent-package/artifacts/family-results
          if-no-files-found: error

  publish:
    name: Publish selected versions
    needs: [prepare, fan-in]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.selected_count != '0' && (needs.fan-in.result == 'success' || needs.prepare.outputs.resume == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: sunder-agent-release-promotion
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CORE_COMMIT: ${{ needs.prepare.outputs.core_commit }}
      CORE_TAG: ${{ needs.prepare.outputs.core_tag }}
      CORE_BUILD_VERSION: ${{ needs.prepare.outputs.core_version }}
      REGISTRY_API_URL: ${{ vars.SUNDER_REGISTRY_API_URL }}
      SUNDER_AGENT_RETAINED_ARCHIVE_DIR: ${{ github.workspace }}/sunder-agent-package/artifacts/release
    defaults:
      run:
        working-directory: sunder-agent-package
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sunder-agent-package
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Younics/sunder-core
          ref: ${{ needs.prepare.outputs.core_commit }}
          path: sunder-core
          persist-credentials: false
      - uses: ./sunder-agent-package/.github/actions/setup
        with:
          node: 'false'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.prepare.outputs.resume != 'true'
        with:
          name: sunder-agent-family-release
          path: sunder-agent-package/artifacts/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-release-selection
          path: sunder-agent-package/artifacts/release
      - name: Reuse unchanged archives and authenticate the selection
        run: |
          test "$(python3 -B scripts/release/agent_release.py file-sha artifacts/release/release-plan.json)" = "${{ needs.prepare.outputs.plan_sha256 }}"
          python3 -B scripts/release/agent_selection.py retain --plan artifacts/release/release-plan.json --directory "$SUNDER_AGENT_RETAINED_ARCHIVE_DIR"
      - name: Recover original tested bytes without rebuilding
        if: needs.prepare.outputs.resume == 'true'
        run: python3 -B scripts/release/agent_pipeline.py recover --core ../sunder-core --directory artifacts/release
      - name: Automatically tag and stage selected package releases
        if: needs.prepare.outputs.resume != 'true'
        run: python3 -B scripts/release/agent_pipeline.py stage --core ../sunder-core --directory artifacts/release
      - name: Publish selected Registry versions; verify unchanged versions read-only
        env:
          SUNDER_REGISTRY_PUBLISH_TOKEN: ${{ secrets.SUNDER_REGISTRY_PUBLISH_TOKEN }}
          SUNDER_REGISTRY_COHORT_CREDENTIAL_SOURCE: api-key
        run: python3 -B scripts/release/agent_pipeline.py publish --core ../sunder-core --directory artifacts/release

  release:
    name: Activate family and announce
    needs: [prepare, publish]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: sunder-agent-release-promotion
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CORE_COMMIT: ${{ needs.prepare.outputs.core_commit }}
      CORE_TAG: ${{ needs.prepare.outputs.core_tag }}
      CORE_BUILD_VERSION: ${{ needs.prepare.outputs.core_version }}
      REGISTRY_API_URL: ${{ vars.SUNDER_REGISTRY_API_URL }}
      SUNDER_REGISTRY_COHORT_CREDENTIAL_SOURCE: api-key
      SUNDER_AGENT_RETAINED_ARCHIVE_DIR: ${{ github.workspace }}/sunder-agent-package/artifacts/release
    defaults:
      run:
        working-directory: sunder-agent-package
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sunder-agent-package
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Younics/sunder-core
          ref: ${{ needs.prepare.outputs.core_commit }}
          path: sunder-core
          persist-credentials: false
      - uses: ./sunder-agent-package/.github/actions/setup
        with:
          node: 'false'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-release-selection
          path: sunder-agent-package/artifacts/release
      - name: Download and verify the exact retained package releases
        run: |
          test "$(python3 -B scripts/release/agent_release.py file-sha artifacts/release/release-plan.json)" = "${{ needs.prepare.outputs.plan_sha256 }}"
          python3 -B scripts/release/agent_pipeline.py recover --core ../sunder-core --directory artifacts/release
      - name: Commit and confirm one retained atomic visibility request
        env:
          SUNDER_REGISTRY_PUBLISH_TOKEN: ${{ secrets.SUNDER_REGISTRY_PUBLISH_TOKEN }}
        run: python3 -B scripts/release/agent_pipeline.py visibility --core ../sunder-core --directory artifacts/release
      - name: Recheck public bytes, policy, tags and six-RID plans before announcement
        env:
          SUNDER_REGISTRY_PUBLISH_TOKEN: ${{ secrets.SUNDER_REGISTRY_PUBLISH_TOKEN }}
        run: python3 -B scripts/release/agent_pipeline.py finalize --core ../sunder-core --directory artifacts/release

  summary:
    name: Summary
    if: always()
    needs: [prepare, validation, native, fan-in, publish, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require all selected release jobs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 -B scripts/ci/workflow_summary.py release
