name: Temporary Windows parity

on:
  push:
    branches: [fix/agent-ci-native-bash-preflight]
  workflow_dispatch:
    inputs:
      packages:
        description: Comma-separated canonical package IDs, or all for the integration checkpoint
        type: string
        default: younics.sunder.package.maker

permissions:
  contents: read

env:
  MSBUILDDISABLENODEREUSE: "1"

concurrency:
  group: agent-platform-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selection:
    name: Select explicit qualification inputs
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.selection.outputs.packages }}
      full: ${{ steps.selection.outputs.full }}
      core_commit: ${{ steps.core.outputs.core_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: selection
        env:
          PACKAGES: ${{ inputs.packages || 'younics.sunder.package.maker' }}
        run: python3 -B scripts/ci/version_selection.py --manual "$PACKAGES"
      - name: Resolve the declared Build release provenance
        id: core
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/ci/agent_ci.py coordinates

  baseline:
    name: Existing component and shared validation
    needs: selection
    uses: ./.github/workflows/sunder-package-smoke.yml
    with:
      packages: ${{ needs.selection.outputs.packages }}
      core_commit: ${{ needs.selection.outputs.core_commit }}
      package-tests: true

  summary:
    name: Require actual Windows regression execution
    if: always()
    # The baseline already owns source/package and shared lanes on all six RIDs.
    # Repeating ARM64 here would collide with its immutable artifact names.
    needs: [selection, baseline]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful selected jobs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -B - <<'PY'
          import json, os
          jobs = json.loads(os.environ["JOB_RESULTS"])
          assert all(jobs[name]["result"] == "success" for name in ("selection", "baseline")), jobs
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: agent-component-*-source-win-*
          path: windows-results
      - name: Reject unavailable or skipped owning regressions on either Windows ABI
        env:
          PACKAGES: ${{ needs.selection.outputs.packages }}
        run: |
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          selected = set(json.loads(os.environ["PACKAGES"]))
          # Reviewed current in-place-update cases, replacing the stale aggregate
          # from the retired replacement-based suite. Keep exact rows on both ABIs.
          local_native_cases = {
              "ContentUpdate_PreservesSecurityWithoutPolicyOrNamespaceWriteRights(partialFailure: False)",
              "ContentUpdate_PreservesSecurityWithoutPolicyOrNamespaceWriteRights(partialFailure: True)",
              "UserFileCreation_MatchesOrdinaryCurrentUserCreationPolicy",
              "ContentUpdate_ReadOnlyOriginalIsRejectedWithoutClearingItsAttribute",
              "ContentUpdate_RetainsAlternateStreamsExtendedAttributesAndStorage(attributeValue: 512, partialFailure: False)",
              "ContentUpdate_RetainsAlternateStreamsExtendedAttributesAndStorage(attributeValue: 512, partialFailure: True)",
              "ContentUpdate_RetainsAlternateStreamsExtendedAttributesAndStorage(attributeValue: 2048, partialFailure: False)",
              "ContentUpdate_RetainsAlternateStreamsExtendedAttributesAndStorage(attributeValue: 2048, partialFailure: True)",
              "ContentUpdate_MappedReaderObservesWritesAndLengthFailureIsExplicit(shrink: False)",
              "ContentUpdate_MappedReaderObservesWritesAndLengthFailureIsExplicit(shrink: True)",
              "CreatedAncestors_AreBorrowedBeforeSiblingCaptureAndSessionOwnsTheirLifetime",
              "CreatedAncestors_ConcurrentApprovedSiblingsShareTheCreationObject",
              "CreatedAncestors_ExpiredOrRevokedCapabilitiesCannotBorrowButTransferredAuthorityKeepsOwnership(expires: False)",
              "CreatedAncestors_ExpiredOrRevokedCapabilitiesCannotBorrowButTransferredAuthorityKeepsOwnership(expires: True)",
              "CreatedAncestors_NestedBorrowSupportsCreationAndCancellationWithoutReopeningOwnedDirectories",
              "DifferentIntegrityPolicy_RemainsAttachedToTheEditedObject(partialFailure: False)",
              "DifferentIntegrityPolicy_RemainsAttachedToTheEditedObject(partialFailure: True)",
              "MetadataChangedDuringContentUpdate_RetainsTheConcurrentChange(changeSecurity: False)",
              "MetadataChangedDuringContentUpdate_RetainsTheConcurrentChange(changeSecurity: True)",
              "ReparseSourceRace_RejectsTheLinkAndPreservesTheOutsideTarget",
              "ContentChangeBeforeWritableAcquisition_RejectsStaleValidator",
              "DirectoryDelete_RecoveryNeverMovesAnUnrelatedReplacement(injectConflict: False)",
              "DirectoryDelete_RecoveryNeverMovesAnUnrelatedReplacement(injectConflict: True)",
              'ExistingWriter_RespectsPerStreamSharingWithoutLosingEitherStream(streamSuffix: "")',
              'ExistingWriter_RespectsPerStreamSharingWithoutLosingEitherStream(streamSuffix: ":metadata")',
              "NewStreamDuringContentUpdate_RemainsOnTheSameObject",
              "DeleteCancellationBeforeQuarantine_DoesNotMoveTheOriginal",
              "LargeAlternateStream_IsRetainedWithoutCopyingOrTruncatingIt",
              "CaseSensitiveDirectory_UpdatesOnlyTheExactCasedTarget",
              "ContentUpdate_WriteDenyingDaclRetainsOriginalAndIndependentStreams",
              "NativeHandles_CreateFlushRenameAndDeleteWithoutPathFallbacks",
              "ContentUpdate_HardLinkSubstitutionLeavesBothObjectsUnchanged",
              "CreatedDirectory_RetiresOnlyItsExactIdentity",
              "ContentWrites_UseExactUtf16ChildNames",
          }
          required = {
              "younics.sunder.package.maker": {"BuilderPathIdentityTests": 9, "BuilderWindowsCachePrivacyTests": 11, "BuilderPackagePathIdentityTests": 7},
              "younics.ai.agent.execution.local": {"WindowsSecureMutationTests": len(local_native_cases)},
          }
          required_methods = {
              "younics.sunder.package.maker": {
                  "BuilderToolchainTests.ToolchainContainmentCannotAdmitACaseDistinctSibling": 2,
                  "BuilderToolchainTests.CopiedReceiptCannotGrantLeaseOrRemovalAuthorityToACaseDistinctWorkspace": 2,
                  "BuilderLocalBackendTests.ExpectedInspectionCannotAuthorizeACaseDistinctEntryOrProjectFolder": 2,
                  "BuilderToolchainTests.ToolchainContainmentAcceptsAnExistingCaseAliasAndItsMissingChildren": 1,
                  "BuilderToolchainTests.RestartThroughAnExistingStorageAliasPreservesCapturedOwnershipAndSuccessfulRemoval": 1,
                  "BuilderLocalBackendTests.BuildCannotAdoptChangedPhysicalSpellingAfterTheExpectedInspectionWasCaptured": 1,
                  "BuilderToolchainTests.CapturedStorageCoordinateCannotBeReboundByForgingItsNewPhysicalSpelling": 1,
                  "BuilderToolchainTests.LeaseOrRemovalRechecksItsCapturedPhysicalCoordinateAfterWaitingForTheOperationLock": 2,
                  "BuilderToolchainTests.RepairNeverReplacesARenamedPhysicalTreeAfterTheArchiveDownloadAwait": 1,
                  "BuilderToolchainTests.FirstInstallCannotReplaceNewCaseAliasStorageAfterItsDownloadAwait": 1,
                  "BuilderToolchainTests.LeaseCannotReturnHealthyAfterItsPhysicalDirectoryChangesDuringTheVersionProbe": 1,
              },
          }
          for rid in ("win-x64", "win-arm64"):
              for package, classes in required.items():
                  if package not in selected:
                      continue
                  directories = list(Path("windows-results").glob(f"agent-component-{package}-source-{rid}-*"))
                  assert len(directories) == 1, (package, rid, directories)
                  observed = {name: [] for name in classes}
                  methods = required_methods.get(package, {})
                  observed_methods = {name: [] for name in methods}
                  for path in directories[0].rglob("*.trx"):
                      document = ET.parse(path)
                      definitions = {}
                      method_definitions = {}
                      for definition in document.findall(".//{*}UnitTest"):
                          method = definition.find("./{*}TestMethod")
                          definitions[definition.get("id")] = method.get("className", "") if method is not None else ""
                          method_definitions[definition.get("id")] = (definitions[definition.get("id")].split(",", 1)[0]
                              + "." + method.get("name", "")) if method is not None else ""
                      for result in document.findall(".//{*}UnitTestResult"):
                          for name in classes:
                              if definitions.get(result.get("testId"), "").split(",", 1)[0].endswith("." + name):
                                  observed[name].append((result.get("testName"), result.get("outcome")))
                          for name in methods:
                              if method_definitions.get(result.get("testId")) == "Sunder.Package.Agent.Tests." + name:
                                  observed_methods[name].append((result.get("testName"), result.get("outcome")))
                  for name, rows in observed.items():
                      assert len(rows) == classes[name] and len({test for test, _ in rows}) == classes[name], (package, rid, name, rows)
                      if package == "younics.ai.agent.execution.local":
                          expected = {"Sunder.Package.Agent.Execution.Local.Tests.WindowsSecureMutationTests." + case for case in local_native_cases}
                          actual = {test for test, _ in rows}
                          assert actual == expected, (package, rid, name, "missing", sorted(expected - actual), "unexpected", sorted(actual - expected))
                      assert all(outcome == "Passed" for _, outcome in rows), (package, rid, name, rows)
                      print(f"{package} / {rid} / {name}: {len(rows)} passed; zero skipped")
                  for name, rows in observed_methods.items():
                      assert len(rows) == methods[name] and len({test for test, _ in rows}) == methods[name], (package, rid, name, rows)
                      assert all(outcome == "Passed" for _, outcome in rows), (package, rid, name, rows)
                      print(f"{package} / {rid} / {name}: {len(rows)} passed; zero skipped")
          PY
