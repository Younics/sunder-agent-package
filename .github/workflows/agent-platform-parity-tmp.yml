name: Temporary Windows parity

on:
  push:
    branches: [fix/agent-ci-native-bash-preflight]
  workflow_dispatch:
    inputs:
      packages:
        description: Comma-separated canonical package IDs, or all for the integration checkpoint
        type: string
        default: younics.sunder.package.maker

permissions:
  contents: read

env:
  MSBUILDDISABLENODEREUSE: "1"

concurrency:
  group: agent-platform-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selection:
    name: Select explicit qualification inputs
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.selection.outputs.packages }}
      full: ${{ steps.selection.outputs.full }}
      core_commit: ${{ steps.core.outputs.core_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: selection
        env:
          PACKAGES: ${{ inputs.packages || 'younics.sunder.package.maker' }}
        run: python3 -B scripts/ci/version_selection.py --manual "$PACKAGES"
      - name: Resolve the declared Build release provenance
        id: core
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/ci/agent_ci.py coordinates

  baseline:
    name: Existing component and shared validation
    needs: selection
    uses: ./.github/workflows/sunder-package-smoke.yml
    with:
      packages: ${{ needs.selection.outputs.packages }}
      core_commit: ${{ needs.selection.outputs.core_commit }}
      package-tests: true

  arm-tools:
    name: Prepare missing Windows ARM64 tools
    needs: [selection, baseline]
    # Unpublished dependency production already prepares tools on all six RIDs.
    if: needs.baseline.outputs.bootstrap_packages == '[]'
    runs-on: windows-11-arm
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: sunder-agent-package
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sunder-agent-package
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Younics/sunder-core
          ref: ${{ needs.selection.outputs.core_commit }}
          path: sunder-core
          persist-credentials: false
      - uses: ./sunder-agent-package/.github/actions/setup
        with:
          node: 'false'
      - run: python3 -B scripts/ci/agent_ci.py prepare-tools --core ../sunder-core --output "$RUNNER_TEMP/core-tools"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-core-tools-win-arm64
          path: ${{ runner.temp }}/core-tools
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  arm-components:
    name: Windows ARM64 component
    needs: [selection, baseline, arm-tools]
    if: >-
      always() && !cancelled() && needs.baseline.result == 'success'
      && (needs.arm-tools.result == 'success'
          || (needs.arm-tools.result == 'skipped' && needs.baseline.outputs.bootstrap_packages != '[]'))
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.selection.outputs.packages) }}
    uses: ./.github/workflows/sunder-package-component.yml
    with:
      package: ${{ matrix.package }}
      core_commit: ${{ needs.selection.outputs.core_commit }}
      inputs_sha256: ${{ needs.baseline.outputs.inputs_sha256 }}
      matrix: '{"include":[{"rid":"win-arm64","platform":"windows","runner":["windows-11-arm"],"mode":"source"},{"rid":"win-arm64","platform":"windows","runner":["windows-11-arm"],"mode":"package"}]}'

  arm-shared:
    name: Windows ARM64 shared family · ${{ matrix.mode }}
    needs: [selection, baseline, arm-tools]
    if: >-
      always() && !cancelled() && needs.selection.outputs.full == 'true' && needs.baseline.result == 'success'
      && (needs.arm-tools.result == 'success'
          || (needs.arm-tools.result == 'skipped' && needs.baseline.outputs.bootstrap_packages != '[]'))
    runs-on: windows-11-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        mode: [source, package]
    defaults:
      run:
        shell: bash
        working-directory: sunder-agent-package
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sunder-agent-package
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Younics/sunder-core
          ref: ${{ needs.selection.outputs.core_commit }}
          path: sunder-core
          persist-credentials: false
      - uses: ./sunder-agent-package/.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-core-tools-win-arm64
          path: ${{ runner.temp }}/core-tools
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-dependency-inputs
          path: ${{ runner.temp }}/agent-inputs
      - name: Verify sealed dependencies
        id: inputs
        env:
          INPUTS_SHA256: ${{ needs.baseline.outputs.inputs_sha256 }}
        run: test "$(python3 -B scripts/release/agent_release.py file-sha "$RUNNER_TEMP/agent-inputs/cold-inputs.json")" = "$INPUTS_SHA256"
      - name: Run the existing full shared reference-mode lane
        env:
          MODE: ${{ matrix.mode }}
        run: >-
          python3 -B scripts/ci/agent_ci.py validate --core ../sunder-core
          --inputs "$RUNNER_TEMP/agent-inputs" --tools "$RUNNER_TEMP/core-tools" --mode "$MODE" --shared
      - name: Retain full shared-family evidence
        if: always() && steps.inputs.outcome != '' && steps.inputs.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-parity-shared-${{ matrix.mode }}-win-arm64-${{ github.run_attempt }}
          path: |
            sunder-agent-package/artifacts/reports
            sunder-agent-package/artifacts/test-results
            sunder-agent-package/artifacts/source-family
            sunder-agent-package/artifacts/source-commands
          if-no-files-found: error
          retention-days: 14

  summary:
    name: Require actual Windows regression execution
    if: always()
    needs: [selection, baseline, arm-tools, arm-components, arm-shared]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful selected jobs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -B - <<'PY'
          import json, os
          jobs = json.loads(os.environ["JOB_RESULTS"])
          assert all(jobs[name]["result"] == "success" for name in ("selection", "baseline", "arm-components")), jobs
          assert jobs["arm-tools"]["result"] in ("success", "skipped"), jobs
          full = jobs["selection"]["outputs"]["full"] == "true"
          assert jobs["arm-shared"]["result"] == ("success" if full else "skipped"), jobs
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: agent-component-*-source-win-*
          path: windows-results
      - name: Reject unavailable or skipped owning regressions on either Windows ABI
        env:
          PACKAGES: ${{ needs.selection.outputs.packages }}
        run: |
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          selected = set(json.loads(os.environ["PACKAGES"]))
          required = {
              "younics.sunder.package.maker": {"BuilderPathIdentityTests": 9, "BuilderWindowsCachePrivacyTests": 11, "BuilderPackagePathIdentityTests": 7},
              "younics.ai.agent.execution.local": {"WindowsSecureMutationTests": 46},
          }
          required_methods = {
              "younics.sunder.package.maker": {
                  "BuilderToolchainTests.ToolchainContainmentCannotAdmitACaseDistinctSibling": 2,
                  "BuilderToolchainTests.CopiedReceiptCannotGrantLeaseOrRemovalAuthorityToACaseDistinctWorkspace": 2,
                  "BuilderLocalBackendTests.ExpectedInspectionCannotAuthorizeACaseDistinctEntryOrProjectFolder": 2,
                  "BuilderToolchainTests.ToolchainContainmentAcceptsAnExistingCaseAliasAndItsMissingChildren": 1,
                  "BuilderToolchainTests.RestartThroughAnExistingStorageAliasPreservesCapturedOwnershipAndSuccessfulRemoval": 1,
                  "BuilderLocalBackendTests.BuildCannotAdoptChangedPhysicalSpellingAfterTheExpectedInspectionWasCaptured": 1,
                  "BuilderToolchainTests.CapturedStorageCoordinateCannotBeReboundByForgingItsNewPhysicalSpelling": 1,
                  "BuilderToolchainTests.LeaseOrRemovalRechecksItsCapturedPhysicalCoordinateAfterWaitingForTheOperationLock": 2,
                  "BuilderToolchainTests.RepairNeverReplacesARenamedPhysicalTreeAfterTheArchiveDownloadAwait": 1,
                  "BuilderToolchainTests.FirstInstallCannotReplaceNewCaseAliasStorageAfterItsDownloadAwait": 1,
                  "BuilderToolchainTests.LeaseCannotReturnHealthyAfterItsPhysicalDirectoryChangesDuringTheVersionProbe": 1,
              },
          }
          for rid in ("win-x64", "win-arm64"):
              for package, classes in required.items():
                  if package not in selected:
                      continue
                  directories = list(Path("windows-results").glob(f"agent-component-{package}-source-{rid}-*"))
                  assert len(directories) == 1, (package, rid, directories)
                  observed = {name: [] for name in classes}
                  methods = required_methods.get(package, {})
                  observed_methods = {name: [] for name in methods}
                  for path in directories[0].rglob("*.trx"):
                      document = ET.parse(path)
                      definitions = {}
                      method_definitions = {}
                      for definition in document.findall(".//{*}UnitTest"):
                          method = definition.find("./{*}TestMethod")
                          definitions[definition.get("id")] = method.get("className", "") if method is not None else ""
                          method_definitions[definition.get("id")] = (definitions[definition.get("id")].split(",", 1)[0]
                              + "." + method.get("name", "")) if method is not None else ""
                      for result in document.findall(".//{*}UnitTestResult"):
                          for name in classes:
                              if definitions.get(result.get("testId"), "").split(",", 1)[0].endswith("." + name):
                                  observed[name].append((result.get("testName"), result.get("outcome")))
                          for name in methods:
                              if method_definitions.get(result.get("testId")) == "Sunder.Package.Agent.Tests." + name:
                                  observed_methods[name].append((result.get("testName"), result.get("outcome")))
                  for name, rows in observed.items():
                      assert len(rows) == classes[name] and len({test for test, _ in rows}) == classes[name], (package, rid, name, rows)
                      assert all(outcome == "Passed" for _, outcome in rows), (package, rid, name, rows)
                      print(f"{package} / {rid} / {name}: {len(rows)} passed; zero skipped")
                  for name, rows in observed_methods.items():
                      assert len(rows) == methods[name] and len({test for test, _ in rows}) == methods[name], (package, rid, name, rows)
                      assert all(outcome == "Passed" for _, outcome in rows), (package, rid, name, rows)
                      print(f"{package} / {rid} / {name}: {len(rows)} passed; zero skipped")
          PY
