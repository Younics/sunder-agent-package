name: Owning-suite interference diagnostic

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: Diagnostic trials per variant (1 to 3)
        type: string
        default: '3'

# Diagnostic branch only: the existing registered manual workflow path is used
# without modifying the qualification candidate or running a release workflow.
permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: plan
        run: python3 -B scripts/test/run-owning-interference.py --plan

  compare:
    name: Compare prepared test workloads · ${{ matrix.rid }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
        working-directory: sunder-agent-package
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sunder-agent-package
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Younics/sunder-core
          ref: 5a51f2040634bfef166516b04342f5115fb1be6a
          path: sunder-core
          persist-credentials: false
      - uses: ./sunder-agent-package/.github/actions/setup
      - name: Compare complete and partitioned inventories without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ matrix.id }}
          REPETITIONS: ${{ inputs.repetitions }}
        run: >-
          python3 -B scripts/test/run-owning-interference.py --profile "$PROFILE"
          --repetitions "$REPETITIONS" --output "$RUNNER_TEMP/interference"
      - name: Retain every diagnostic outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: owning-interference-${{ matrix.rid }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/interference
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
