name: Sunder Agent Package Smoke

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

env:
  DOTNET_VERSION: "10.0.100"
  MSBUILDDISABLENODEREUSE: "1"

jobs:
  core-dependency:
    name: Resolve Core main commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.core.outputs.commit }}
    steps:
      - name: Resolve Core main commit
        id: core
        shell: bash
        run: |
          set -euo pipefail
          read -r commit ref < <(git ls-remote --exit-code https://github.com/Younics/sunder-core.git refs/heads/main)
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ || "$ref" != "refs/heads/main" ]]; then
            echo "Could not resolve exactly one full commit SHA for Younics/sunder-core main." >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  release-smoke:
    name: Build and smoke complete family
    needs: core-dependency
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Agent repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sunder-agent-package
          persist-credentials: false

      - name: Checkout resolved Core commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Younics/sunder-core
          ref: ${{ needs.core-dependency.outputs.commit }}
          path: sunder-core
          persist-credentials: false

      - name: Verify exact Core checkout
        working-directory: sunder-core
        shell: bash
        env:
          EXPECTED_CORE_COMMIT: ${{ needs.core-dependency.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_CORE_COMMIT"

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore and build coordinated Agent sources
        working-directory: sunder-agent-package
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -er '.releaseVersion' packages.json)"
          mkdir -p artifacts/reports
          bash scripts/generate-test-inventory.sh > artifacts/reports/test-inventory.json
          test "$(jq '.projects | length' artifacts/reports/test-inventory.json)" -eq 11
          bash scripts/test-silent-return-analyzer.fixture.sh
          bash scripts/release/verify-agent-release-version.fixture.sh
          bash scripts/generate-test-duration-report.fixture.sh
          dotnet restore Sunder.AgentPackage.slnx --force-evaluate -p:SunderUseSourceSdk=true
          dotnet build Sunder.AgentPackage.slnx -c Release --no-restore -m:1 -p:SunderUseSourceSdk=true -p:SunderAgentVersion="$version" -p:ContinuousIntegrationBuild=true

      - name: Run complete source-mode behavioral suite
        id: source_tests
        continue-on-error: true
        working-directory: sunder-agent-package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/test-results/full
          dotnet test Sunder.AgentPackage.slnx -c Release --no-build --no-restore -m:1 \
            -p:SunderUseSourceSdk=true --logger trx \
            --results-directory "$PWD/artifacts/test-results/full"

      - name: Run required Linux selection once
        id: required_linux_test
        continue-on-error: true
        working-directory: sunder-agent-package
        shell: bash
        env:
          SUNDER_REQUIRE_TEST_PREREQUISITES: "1"
        run: |
          set -euo pipefail
          project=tests/Sunder.Package.Agent.Execution.Local.Tests/Sunder.Package.Agent.Execution.Local.Tests.csproj
          test_fqn=Sunder.Package.Agent.Execution.Local.Tests.FilesToolSourceRefactorTests.ApplyPatch_LinuxAtEmptyPathEperm_UsesPortablePublishFallback
          discovered="$(dotnet test "$project" -c Release --no-build --no-restore -m:1 \
            -p:SunderUseSourceSdk=true --list-tests --filter "FullyQualifiedName=$test_fqn")"
          grep -Fqx "    $test_fqn" <<< "$discovered"
          mkdir -p artifacts/test-results/required
          dotnet test "$project" -c Release --no-build --no-restore -m:1 \
            -p:SunderUseSourceSdk=true --filter "FullyQualifiedName=$test_fqn" \
            --logger "trx;LogFileName=required-linux.trx" \
            --results-directory "$PWD/artifacts/test-results/required"

      - name: Run required real-Docker selection once
        id: required_docker_test
        continue-on-error: true
        working-directory: sunder-agent-package
        shell: bash
        env:
          SUNDER_DOCKER_INTEGRATION: "1"
          SUNDER_REQUIRE_TEST_PREREQUISITES: "1"
        run: |
          set -euo pipefail
          project=tests/Sunder.Package.Agent.Tests/Sunder.Package.Agent.Tests.csproj
          test_fqn=Sunder.Package.Agent.Tests.WorkspaceTests.DockerExecutionTarget_RealDaemon_VerifiesMountAndContainerCanReadNestedHostCreation
          discovered="$(dotnet test "$project" -c Release --no-build --no-restore -m:1 \
            -p:SunderUseSourceSdk=true --list-tests --filter "FullyQualifiedName=$test_fqn")"
          grep -Fqx "    $test_fqn" <<< "$discovered"
          mkdir -p artifacts/test-results/required
          dotnet test "$project" -c Release --no-build --no-restore -m:1 \
            -p:SunderUseSourceSdk=true --filter "FullyQualifiedName=$test_fqn" \
            --logger "trx;LogFileName=required-docker.trx" \
            --results-directory "$PWD/artifacts/test-results/required"

      - name: Summarize source-mode test evidence
        id: source_test_summary
        if: always()
        working-directory: sunder-agent-package
        shell: bash
        run: |
          set -uo pipefail
          status=0
          python3 scripts/generate-test-duration-report.py artifacts/test-results \
            --inventory artifacts/reports/test-inventory.json \
            --mode source \
            --platform linux \
            --expectations tests/test-evidence-expectations.json \
            > artifacts/reports/test-duration-report.json || status=1
          python3 scripts/generate-test-duration-report.py artifacts/test-results/required \
            --expected-skips 0 \
            > artifacts/reports/required-test-duration-report.json || status=1
          exit "$status"

      - name: Upload source-mode test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-agent-source-mode-tests
          path: |
            sunder-agent-package/artifacts/reports/test-inventory.json
            sunder-agent-package/artifacts/reports/test-duration-report.json
            sunder-agent-package/artifacts/reports/required-test-duration-report.json
            sunder-agent-package/artifacts/test-results/**/*.trx
          if-no-files-found: error
          retention-days: 7

      - name: Enforce source-mode test evidence
        if: always()
        working-directory: sunder-agent-package
        shell: bash
        env:
          DOCKER_TEST_OUTCOME: ${{ steps.required_docker_test.outcome }}
          LINUX_TEST_OUTCOME: ${{ steps.required_linux_test.outcome }}
          SOURCE_SUMMARY_OUTCOME: ${{ steps.source_test_summary.outcome }}
          SOURCE_TEST_OUTCOME: ${{ steps.source_tests.outcome }}
        run: |
          set -euo pipefail
          test "$SOURCE_TEST_OUTCOME" = success
          test "$LINUX_TEST_OUTCOME" = success
          test "$DOCKER_TEST_OUTCOME" = success
          test "$SOURCE_SUMMARY_OUTCOME" = success
          jq -e '
            .selection == {mode: "source", lane: null, platform: "linux"}
            and .summary.failed == 0
            and .summary.other == 0
            and .canonicalIdentityExpectation == {platform: "linux", enforced: true}
            and (.projectSuiteEvidence | length) == 11
            and (.identityEvidence | length) == 11
            and .evidenceViolations == []
          ' artifacts/reports/test-duration-report.json >/dev/null
          jq -e '
            .summary == {
              total: 2,
              passed: 2,
              failed: 0,
              skipped: 0,
              other: 0,
              totalDurationMilliseconds: .summary.totalDurationMilliseconds
            }
            and .evidenceViolations == []
          ' artifacts/reports/required-test-duration-report.json >/dev/null

      - name: Pack Protocol and every runtime archive once
        working-directory: sunder-agent-package
        shell: bash
        run: |
          set -euo pipefail
          output="$PWD/artifacts/family"
          mkdir -p "$output"
          version="$(jq -er '.releaseVersion' packages.json)"

          dotnet pack src/Sunder.Package.Agent.Contracts/Sunder.Package.Agent.Contracts.csproj \
            -c Release --no-build --no-restore -o "$output" \
            -p:SunderUseSourceSdk=true -p:SunderAgentVersion="$version" \
            -p:ContinuousIntegrationBuild=true
          bash scripts/compatibility/verify-packed-protocol.sh \
            "$output/Sunder.Package.Agent.Protocol.$version.nupkg" "$version"

          while IFS=$'\t' read -r package_id project_path; do
            output_path="$output/$package_id.$version.sunderpkg"
            dotnet restore "$project_path" --force-evaluate -p:SunderUseSourceSdk=true
            dotnet msbuild "$project_path" -t:PackSunderPackage -m:1 \
              -p:Configuration=Release -p:SunderUseSourceSdk=true \
              -p:SunderAgentVersion="$version" -p:ContinuousIntegrationBuild=true \
              -p:SunderPackageOutputPath="$output_path"
          done < <(jq -r '.packages | map(select(.artifactType == "sunderpkg")) | sort_by(.key)[] | [.packageId, .projectPath] | @tsv' packages.json)

          runtime_count="$(jq '[.packages[] | select(.artifactType == "sunderpkg")] | length' packages.json)"
          test "$(find "$output" -maxdepth 1 -name '*.sunderpkg' -type f | wc -l)" -eq "$runtime_count"
          test -f "$output/Sunder.Package.Agent.Protocol.$version.nupkg"
          test "$(find "$output" -maxdepth 1 -type f | wc -l)" -eq "$((runtime_count + 1))"

          protocol_nuspec="$(unzip -p "$output/Sunder.Package.Agent.Protocol.$version.nupkg" '*.nuspec')"
          if ! grep -Eq 'id="Sunder\.Sdk" version="\[1\.1\.0, ?1\.2\.0\)"' <<< "$protocol_nuspec"; then
            echo "Agent Protocol does not bound its Sunder.Sdk dependency to the published 1.1 line." >&2
            exit 1
          fi

          while IFS=$'\t' read -r package_id provider_ids; do
            archive="$output/$package_id.$version.sunderpkg"
            manifest="$RUNNER_TEMP/$package_id-manifest.json"
            content_index="$RUNNER_TEMP/$package_id-content-index.json"
            unzip -p "$archive" manifest/sunder-package.json > "$manifest"
            unzip -p "$archive" manifest/content-index.json > "$content_index"
            jq --argjson provider_ids "$provider_ids" -e '
              def supported_rids: ["linux-arm64", "linux-x64", "osx-arm64", "osx-x64", "win-arm64", "win-x64"];
              ([.targets[] | select(.role == "runtime") | .rid] | sort) == supported_rids and
              (([.targets[] | select(.role == "app") | .rid] | sort) as $app_rids |
                $app_rids == [] or $app_rids == supported_rids) and
              all(.targets[];
                if .role == "runtime" then
                  .kind == "worker" and (.requiredHostCapabilities | index("worker-protocol.v3") != null)
                elif .role == "app" then
                  .kind == "avalonia" and (.requiredHostCapabilities | index("worker-protocol.v3") == null)
                else false end) and
              all(.dependsOn[]; .versionRange == ">=2.0.0 <3.0.0") and
              ([.provides[].providerId] | sort) == ($provider_ids | sort)
            ' "$manifest" >/dev/null
            jq -e '
              all(.files[];
                .path == "manifest/sunder-package.json" or
                (.path | startswith("payload/shared/")) or
                (.path | startswith("payload/app/")) or
                (.path | startswith("payload/runtime/"))) and
              all(.files[] | select(.path | startswith("payload/app/"));
                (.path | contains("Sunder.Sdk.Worker")) == false and
                (.path | test("/[^/]+\\.runtimeconfig\\.json$")) == false) and
              all(.files[] | select(.path | startswith("payload/runtime/"));
                (.path | test("/[^/]+\\.App\\.(dll|pdb|deps\\.json)$")) == false)
            ' "$content_index" >/dev/null
          done < <(jq -r '.packages | map(select(.artifactType == "sunderpkg")) | sort_by(.key)[] | [.packageId, (.providerIds | tojson)] | @tsv' packages.json)

          SUNDER_REQUIRE_TEST_PREREQUISITES=1 \
          SUNDER_AGENT_PACKAGE_ARCHIVE_DIR="$output" \
            dotnet test tests/Sunder.Package.Agent.Tests/Sunder.Package.Agent.Tests.csproj \
              -c Release --no-build --no-restore -m:1 \
              --filter "FullyQualifiedName~PackageFamilyArchiveContractTests"

      - name: Build Core validation and smoke paths
        working-directory: sunder-core
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore languages/csharp/dotnet/host/Sunder.Cli/Sunder.Cli.csproj --locked-mode
          dotnet restore languages/csharp/dotnet/tests/Sunder.Runtime.Host.Tests/Sunder.Runtime.Host.Tests.csproj --locked-mode
          dotnet restore languages/csharp/dotnet/tests/Sunder.App.Tests/Sunder.App.Tests.csproj --locked-mode
          dotnet build languages/csharp/dotnet/host/Sunder.Cli/Sunder.Cli.csproj -c Release --no-restore
          dotnet build languages/csharp/dotnet/tests/Sunder.Runtime.Host.Tests/Sunder.Runtime.Host.Tests.csproj -c Release --no-restore
          dotnet build languages/csharp/dotnet/tests/Sunder.App.Tests/Sunder.App.Tests.csproj -c Release --no-restore

      - name: Validate exact family archives through Package Format
        working-directory: sunder-agent-package
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r archive; do
            dotnet ../sunder-core/languages/csharp/dotnet/host/Sunder.Cli/bin/Release/net10.0/sunder.dll dev package validate "$archive"
          done < <(find artifacts/family -maxdepth 1 -name '*.sunderpkg' -type f | sort)

      - name: Runtime clean lifecycle smoke for exact family bytes
        working-directory: sunder-core
        shell: bash
        env:
          SUNDER_AGENT_PACKAGE_ARCHIVE_DIR: ${{ github.workspace }}/sunder-agent-package/artifacts/family
          SUNDER_AGENT_UI_SNAPSHOT_DIR: ${{ github.workspace }}/agent-ui-snapshot
        run: |
          set -euo pipefail
          mkdir -p "$SUNDER_AGENT_UI_SNAPSHOT_DIR"
          test_fqn="Sunder.Runtime.Host.Tests.AgentPackageReleaseSmokeTests.ReleaseArchives_InstallActivateUnloadReloadAndReinstallAsOneFamily"
          discovered="$(dotnet test languages/csharp/dotnet/tests/Sunder.Runtime.Host.Tests/Sunder.Runtime.Host.Tests.csproj -c Release --no-build --no-restore --list-tests --filter "FullyQualifiedName=$test_fqn")"
          grep -Fqx "    $test_fqn" <<< "$discovered"
          dotnet test languages/csharp/dotnet/tests/Sunder.Runtime.Host.Tests/Sunder.Runtime.Host.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName=$test_fqn"

      - name: App activation smoke for Runtime-produced snapshot
        working-directory: sunder-core
        shell: bash
        env:
          SUNDER_AGENT_UI_SNAPSHOT_DIR: ${{ github.workspace }}/agent-ui-snapshot
        run: |
          set -euo pipefail
          test_fqn="Sunder.App.Tests.AgentPackageReleaseSmokeTests.RuntimeProducedAgentSnapshot_MaterializesAndActivatesInApp"
          discovered="$(dotnet test languages/csharp/dotnet/tests/Sunder.App.Tests/Sunder.App.Tests.csproj -c Release --no-build --no-restore --list-tests --filter "FullyQualifiedName=$test_fqn")"
          grep -Fqx "    $test_fqn" <<< "$discovered"
          dotnet test languages/csharp/dotnet/tests/Sunder.App.Tests/Sunder.App.Tests.csproj -c Release --no-build --no-restore --filter "FullyQualifiedName=$test_fqn"

      - name: Upload verified family artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-agent-family-smoke
          path: sunder-agent-package/artifacts/family/*
          if-no-files-found: error
          retention-days: 7
