# Diagnostic ref only. Tests run from an independent, unmodified candidate checkout.
name: Verify affected native fixtures
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact candidate commit to check
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  verify:
    name: ${{ matrix.profile }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: linux-arm64-shared, runner: ubuntu-24.04-arm}
          - {profile: win-arm64-memory, runner: windows-11-arm}
          - {profile: osx-arm64-view, runner: macos-15}
    defaults:
      run:
        shell: bash
        working-directory: sunder-agent-package
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate }}
          path: sunder-agent-package
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Younics/sunder-core
          ref: 5a51f2040634bfef166516b04342f5115fb1be6a
          path: sunder-core
          persist-credentials: false
      - uses: ./sunder-agent-package/.github/actions/setup
      - name: Verify candidate against the affected suite
        env:
          CANDIDATE: ${{ inputs.candidate }}
          PROFILE: ${{ matrix.profile }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -B ../diagnostic/scripts/test/check-failed-fixtures.py "$PROFILE" "$CANDIDATE" "$RUNNER_TEMP/fixture-evidence"
      - name: Retain results, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: affected-fixtures-${{ matrix.profile }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fixture-evidence
          if-no-files-found: error
          retention-days: 90
