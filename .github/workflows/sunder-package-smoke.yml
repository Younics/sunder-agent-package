# Diagnostic ref only. Tests run from an independent, unmodified candidate checkout.
name: Verify Windows transcript geometry fixtures
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact candidate commit to check
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  verify:
    name: win-x64-transcript-geometry
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
        working-directory: sunder-agent-package
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate }}
          path: sunder-agent-package
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Younics/sunder-core
          ref: 5a51f2040634bfef166516b04342f5115fb1be6a
          path: sunder-core
          persist-credentials: false
      - uses: ./sunder-agent-package/.github/actions/setup
      - name: Verify candidate against the affected suite
        env:
          CANDIDATE: ${{ inputs.candidate }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -B ../diagnostic/scripts/test/check-failed-fixtures.py "$CANDIDATE" "$RUNNER_TEMP/fixture-evidence"
      - name: Retain results, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: win-x64-transcript-geometry-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fixture-evidence
          if-no-files-found: error
          retention-days: 90
