name: Validate

on:
  pull_request:
  merge_group:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      packages:
        description: Comma-separated package IDs, or all
        type: string
        default: all
permissions:
  contents: read
  actions: read
env:
  MSBUILDDISABLENODEREUSE: "1"

jobs:
  prepare:
    name: Select validation scope
    runs-on: ubuntu-24.04
    outputs:
      behavior: ${{ steps.selection.outputs.behavior }}
      native: ${{ steps.selection.outputs.native }}
      packages: ${{ steps.selection.outputs.packages }}
      selected_count: ${{ steps.selection.outputs.selected_count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select packages and native test targets
        id: selection
        env:
          PACKAGES: ${{ inputs.packages }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          RUNNER_VARIABLES: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            python3 -B scripts/ci/version_selection.py --matrix --manual "${PACKAGES:-all}"
          elif [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            python3 -B scripts/ci/version_selection.py --matrix --all
          else
            python3 -B scripts/ci/version_selection.py --matrix --changed-since "$BASE"
          fi

  checks:
    name: Check repository scripts
    needs: prepare
    if: needs.prepare.outputs.selected_count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sunder-agent-package
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sunder-agent-package
          persist-credentials: false
      - uses: ./sunder-agent-package/.github/actions/setup
      - run: python3 -B scripts/ci/agent_ci.py preflight

  dependencies:
    name: Prepare locked dependencies
    needs: prepare
    if: needs.prepare.outputs.selected_count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      pending: ${{ steps.inputs.outputs.pending }}
      closure: ${{ steps.inputs.outputs.packages }}
      sha256: ${{ steps.seal.outputs.sha256 }}
    defaults:
      run:
        working-directory: sunder-agent-package
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sunder-agent-package
          persist-credentials: false
      - uses: ./sunder-agent-package/.github/actions/setup
        with:
          node: 'false'
      - name: Verify evaluated versions and resolve inputs
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGES: ${{ needs.prepare.outputs.packages }}
        run: |
          set -euo pipefail
          python3 -B scripts/ci/version_selection.py --packages "$PACKAGES" --verify-versions
          python3 -B scripts/ci/agent_ci.py resolve --output "$RUNNER_TEMP/agent-inputs" --packages "$PACKAGES" --test-dependencies --allow-missing
      - name: Seal published inputs
        id: seal
        env:
          PENDING: ${{ steps.inputs.outputs.pending }}
          CLOSURE: ${{ steps.inputs.outputs.packages }}
        run: |
          set -euo pipefail
          if [[ "$PENDING" == '[]' ]]; then
            python3 -B scripts/release/release_inputs.py fetch "$PWD" "$RUNNER_TEMP/agent-inputs" "$GITHUB_SHA" --packages "$CLOSURE" --prepared
            echo "sha256=$(python3 -B scripts/release/agent_release.py file-sha "$RUNNER_TEMP/agent-inputs/cold-inputs.json")" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.inputs.outputs.pending != '[]' && 'agent-prepared-dependencies' || 'agent-dependency-inputs' }}
          path: ${{ runner.temp }}/agent-inputs/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Retain rejected dependency inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-input-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-inputs/
          if-no-files-found: ignore
          retention-days: 14

  bootstrap:
    name: Build unpublished owner
    needs: [prepare, checks, dependencies]
    if: needs.dependencies.outputs.pending != '' && needs.dependencies.outputs.pending != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.dependencies.outputs.pending) }}
    uses: ./.github/workflows/sunder-package-component.yml
    with:
      bootstrap: true
      package: ${{ matrix.package }}
      matrix: ${{ needs.prepare.outputs.native }}

  admit-owner:
    name: Verify owner reproduction before consumers
    needs: [dependencies, bootstrap]
    if: needs.bootstrap.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      sha256: ${{ steps.inputs.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-prepared-dependencies
          path: ${{ runner.temp }}/agent-inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: agent-candidate-*
          merge-multiple: true
          path: ${{ runner.temp }}/candidates
      - name: Match the rebuilt owner to the exact locks and authoring archive
        id: inputs
        env:
          PACKAGES: ${{ needs.dependencies.outputs.closure }}
          PENDING: ${{ needs.dependencies.outputs.pending }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B scripts/ci/agent_ci.py complete-inputs --inputs "$RUNNER_TEMP/agent-inputs" --candidates "$RUNNER_TEMP/candidates"
          python3 -B scripts/release/release_inputs.py fetch "$PWD" "$RUNNER_TEMP/agent-inputs" "$GITHUB_SHA" --packages "$PACKAGES" --prepared
          python3 -B scripts/ci/owner_authoring.py verify-reproduction "$RUNNER_TEMP/agent-inputs" "$PENDING" "$RUNNER_TEMP/owner-reproduction.json"
          echo "sha256=$(python3 -B scripts/release/agent_release.py file-sha "$RUNNER_TEMP/agent-inputs/cold-inputs.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-dependency-inputs
          path: ${{ runner.temp }}/agent-inputs
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-owner-reproduction-${{ github.run_attempt }}
          path: ${{ runner.temp }}/owner-reproduction.json
          if-no-files-found: error
          retention-days: 90
      - name: Retain rejected owner inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-admission-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-inputs
          if-no-files-found: error
          retention-days: 14

  behavior:
    name: ${{ matrix.label }} · ${{ matrix.rid }}
    needs: [prepare, checks, dependencies, admit-owner]
    if: >-
      !cancelled() && needs.checks.result == 'success' && needs.dependencies.result == 'success'
      && ((needs.dependencies.outputs.pending == '[]' && needs.dependencies.outputs.sha256 != '')
          || (needs.admit-owner.result == 'success' && needs.admit-owner.outputs.sha256 != ''))
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.lane == 'component' && 180 || 360 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.behavior) }}
    defaults:
      run:
        shell: bash
        working-directory: sunder-agent-package
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sunder-agent-package
          persist-credentials: false
      - uses: ./sunder-agent-package/.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-dependency-inputs
          path: ${{ runner.temp }}/agent-inputs
      - name: Run Windows script transport checks
        if: matrix.lane == 'family' && runner.os == 'Windows'
        run: |
          set -euo pipefail
          python3 -B scripts/test/test_bash_runtime.py
          bash scripts/test/test-silent-return-analyzer.fixture.sh
      - name: Build and test against declared public dependencies
        id: tests
        env:
          INPUTS_SHA256: ${{ needs.admit-owner.outputs.sha256 || needs.dependencies.outputs.sha256 }}
          RID: ${{ matrix.rid }}
          LANE: ${{ matrix.lane }}
          PACKAGE: ${{ matrix.package }}
          STRESS: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          test "$(python3 -B scripts/release/agent_release.py file-sha "$RUNNER_TEMP/agent-inputs/cold-inputs.json")" = "$INPUTS_SHA256"
          args=(--inputs "$RUNNER_TEMP/agent-inputs" --rid "$RID")
          case "$LANE" in
            component)
              packages="$(python3 -B -c 'import json,os; print(json.dumps([os.environ["PACKAGE"]]))')"
              args+=(--packages "$packages")
              ;;
            family)
              app_input="$RUNNER_TEMP/agent-app"
              python3 -B scripts/release/published_app.py "$app_input"
              app="$(python3 -B -c 'import json,sys; from pathlib import Path; p=Path(sys.argv[1]); print(p / json.loads((p / "app-input.json").read_text())["app"])' "$app_input")"
              args+=(--shared --published-app "$app")
              ;;
            *) exit 2 ;;
          esac
          [[ "$STRESS" != true ]] || args+=(--stress)
          python3 -B scripts/ci/agent_ci.py validate "${args[@]}"
      - name: Retain test and build diagnostics
        if: always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure' || steps.tests.outcome == 'cancelled')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-validation-${{ matrix.lane }}${{ matrix.package && format('-{0}', matrix.package) || '' }}-${{ matrix.rid }}-${{ github.run_attempt }}
          path: |
            sunder-agent-package/artifacts/reports
            sunder-agent-package/artifacts/test-results
            sunder-agent-package/artifacts/stress
            sunder-agent-package/artifacts/source-components
            sunder-agent-package/artifacts/source-family
            sunder-agent-package/artifacts/source-commands
          if-no-files-found: ignore
          retention-days: 14

  summary:
    name: Summary
    if: always()
    needs: [prepare, checks, dependencies, bootstrap, admit-owner, behavior]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 -B scripts/ci/workflow_summary.py validate
