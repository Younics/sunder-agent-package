name: Validate

on:
  pull_request:
  merge_group:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      packages:
        description: Comma-separated package IDs, or all for full validation
        type: string
        default: all
      package-tests:
        description: Include locked-package compatibility on the behavior runners
        type: boolean
        default: false
      builder-diagnostics:
        description: Run focused then full Builder tests on Windows/Linux
        type: boolean
        default: false
  workflow_call:
    inputs:
      core_commit:
        type: string
        default: ""
      package-tests:
        type: boolean
        default: false
      packages:
        description: JSON package IDs selected by the release planner
        type: string
        default: ""
      native:
        description: Prepare shared Core tools for all six release platforms
        type: boolean
        default: false
    outputs:
      inputs_sha256:
        description: Digest of the one shared exact dependency inventory
        value: ${{ jobs.dependencies.outputs.sha256 }}
      bootstrap_packages:
        description: Exact six-native owner candidates already composed
        value: ${{ jobs.dependency-discovery.outputs.pending }}

permissions:
  contents: read
env:
  MSBUILDDISABLENODEREUSE: "1"

jobs:
  prepare:
    name: Select versions
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.behavior }}
      preflight: ${{ steps.matrix.outputs.preflight }}
      core_commit: ${{ inputs.core_commit || steps.core.outputs.core_commit }}
      core_tag: ${{ steps.core.outputs.core_tag }}
      core_version: ${{ steps.core.outputs.core_version }}
      native: ${{ steps.matrix.outputs.native }}
      full: ${{ steps.selection.outputs.full }}
      packages: ${{ steps.selection.outputs.packages }}
      selected_count: ${{ steps.selection.outputs.selected_count }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compare authored versions before toolchain setup
        id: selection
        env:
          PACKAGES: ${{ inputs.packages }}
          BUILDER_DIAGNOSTICS: ${{ inputs.builder-diagnostics }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "$BUILDER_DIAGNOSTICS" == true ]]; then
            python3 -B scripts/ci/version_selection.py --packages '["younics.sunder.package.maker"]'
          elif [[ "$PACKAGES" == \[* ]]; then
            python3 -B scripts/ci/version_selection.py --packages "$PACKAGES"
          elif [[ "${{ github.event_name }}" == workflow_dispatch ]]; then
            python3 -B scripts/ci/version_selection.py --manual "${PACKAGES:-all}"
          elif [[ "$FULL" == true ]]; then
            python3 -B scripts/ci/version_selection.py --all
          else
            python3 -B scripts/ci/version_selection.py --base "$BASE"
          fi
      - name: Resolve Core source from the declared build-tool dependency
        id: core
        if: steps.selection.outputs.selected_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/ci/agent_ci.py coordinates
      - id: matrix
        if: steps.selection.outputs.selected_count != '0'
        env:
          PACKAGE_TESTS: ${{ (inputs.package-tests || steps.selection.outputs.full == 'true') && !inputs.builder-diagnostics }}
          RUNNER_VARIABLES: ${{ toJSON(vars) }}
        run: |
          args=()
          [[ "$PACKAGE_TESTS" != true ]] || args+=(--package-tests)
          python3 -B scripts/ci/agent_ci.py matrices "${args[@]}"

  preflight:
    name: Check scripts · ${{ matrix.rid }}
    needs: prepare
    if: needs.prepare.outputs.selected_count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.preflight) }}
    defaults:
      run:
        shell: bash
        working-directory: sunder-agent-package
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sunder-agent-package
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Younics/sunder-core
          ref: ${{ needs.prepare.outputs.core_commit }}
          path: sunder-core
          persist-credentials: false
      - uses: ./sunder-agent-package/.github/actions/setup
      - name: Check inventory and dependency-independent scripts
        id: scripts
        env:
          PACKAGES: ${{ needs.prepare.outputs.packages }}
        run: python3 -B scripts/ci/agent_ci.py preflight --packages "$PACKAGES"
      - name: Retain preflight diagnostics
        if: always() && steps.scripts.outcome != 'skipped' && steps.scripts.outcome != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-agent-preflight-${{ matrix.platform }}-${{ github.run_attempt }}
          path: sunder-agent-package/artifacts/reports
          if-no-files-found: error
          retention-days: 14

  dependency-discovery:
    name: Discover exact dependencies
    needs: [prepare, preflight]
    if: needs.prepare.outputs.selected_count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      pending: ${{ steps.inputs.outputs.pending }}
      packages: ${{ steps.inputs.outputs.packages }}
    defaults:
      run:
        shell: bash
        working-directory: sunder-agent-package
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sunder-agent-package
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Younics/sunder-core
          ref: ${{ needs.prepare.outputs.core_commit }}
          path: sunder-core
          persist-credentials: false
      - uses: ./sunder-agent-package/.github/actions/setup
        with:
          node: 'false'
      - name: Verify evaluated versions only for selected packages
        env:
          PACKAGES: ${{ needs.prepare.outputs.packages }}
        run: python3 -B scripts/ci/version_selection.py --packages "$PACKAGES" --verify-versions
      - name: Resolve exact selected archives, catalog and Core source
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_COMMIT: ${{ needs.prepare.outputs.core_commit }}
          PACKAGES: ${{ needs.prepare.outputs.packages }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/reports
          python3 -B scripts/ci/agent_ci.py resolve --core ../sunder-core --output "$RUNNER_TEMP/agent-inputs" --packages "$PACKAGES" --test-dependencies --allow-missing 2>&1 | tee artifacts/reports/input-preparation.log
      - name: Retain shared exact dependency bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-prepared-dependencies
          path: ${{ runner.temp }}/agent-inputs/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Retain rejected dependency bytes for identity diagnostics
        if: failure() && steps.inputs.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-input-diagnostics-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/agent-inputs/
            sunder-agent-package/artifacts/reports/input-preparation.log
          if-no-files-found: error
          retention-days: 14

  tools:
    name: Prepare Core tools · ${{ matrix.rid }}
    needs: [prepare, dependency-discovery]
    if: needs.prepare.outputs.selected_count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON((inputs.native || needs.dependency-discovery.outputs.pending != '[]') && needs.prepare.outputs.native || needs.prepare.outputs.preflight) }}
    defaults:
      run:
        shell: bash
        working-directory: sunder-agent-package
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sunder-agent-package
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Younics/sunder-core
          ref: ${{ needs.prepare.outputs.core_commit }}
          path: sunder-core
          persist-credentials: false
      - uses: ./sunder-agent-package/.github/actions/setup
        with:
          node: 'false'
      - run: python3 -B scripts/ci/agent_ci.py prepare-tools --core ../sunder-core --output "$RUNNER_TEMP/core-tools"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-core-tools-${{ matrix.rid }}
          path: ${{ runner.temp }}/core-tools
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  bootstrap:
    name: Compose unpublished dependency
    needs: [prepare, dependency-discovery, tools]
    if: needs.prepare.outputs.selected_count != '0' && needs.dependency-discovery.outputs.pending != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.dependency-discovery.outputs.pending) }}
    uses: ./.github/workflows/sunder-package-component.yml
    with:
      operation: native
      bootstrap: true
      package: ${{ matrix.package }}
      core_commit: ${{ needs.prepare.outputs.core_commit }}
      core_tag: ${{ needs.prepare.outputs.core_tag }}
      core_version: ${{ needs.prepare.outputs.core_version }}
      matrix: ${{ needs.prepare.outputs.native }}

  dependencies:
    name: Admit exact composed dependencies
    needs: [prepare, dependency-discovery, tools, bootstrap]
    if: >-
      always() && !cancelled() && needs.prepare.outputs.selected_count != '0'
      && needs.dependency-discovery.result == 'success' && needs.tools.result == 'success'
      && ((needs.dependency-discovery.outputs.pending == '[]' && needs.bootstrap.result == 'skipped') || needs.bootstrap.result == 'success')
    runs-on: ubuntu-24.04
    outputs:
      sha256: ${{ steps.inputs.outputs.sha256 }}
    defaults:
      run:
        shell: bash
        working-directory: sunder-agent-package
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sunder-agent-package
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Younics/sunder-core
          ref: ${{ needs.prepare.outputs.core_commit }}
          path: sunder-core
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-prepared-dependencies
          path: ${{ runner.temp }}/agent-inputs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.dependency-discovery.outputs.pending != '[]'
        with:
          pattern: agent-candidate-*
          merge-multiple: true
          path: ${{ runner.temp }}/candidates
      - name: Verify exact owner content identity before any consumer build
        if: needs.dependency-discovery.outputs.pending != '[]'
        run: python3 -B scripts/ci/agent_ci.py complete-inputs --core ../sunder-core --inputs "$RUNNER_TEMP/agent-inputs" --candidates "$RUNNER_TEMP/candidates"
      - id: inputs
        env:
          PACKAGES: ${{ needs.dependency-discovery.outputs.packages }}
          CORE_COMMIT: ${{ needs.prepare.outputs.core_commit }}
        run: |
          set -euo pipefail
          python3 -B scripts/release/release_inputs.py fetch "$PWD" "$RUNNER_TEMP/agent-inputs" "$GITHUB_SHA" "$CORE_COMMIT" --packages "$PACKAGES" --prepared
          echo "sha256=$(python3 -B scripts/release/agent_release.py file-sha "$RUNNER_TEMP/agent-inputs/cold-inputs.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-dependency-inputs
          path: ${{ runner.temp }}/agent-inputs
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Retain rejected identity diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-admission-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-inputs
          if-no-files-found: error
          retention-days: 14

  components:
    name: Validate component
    needs: [prepare, dependencies, tools]
    if: needs.prepare.outputs.selected_count != '0' && !inputs.builder-diagnostics
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.prepare.outputs.packages) }}
    uses: ./.github/workflows/sunder-package-component.yml
    with:
      package: ${{ matrix.package }}
      core_commit: ${{ needs.prepare.outputs.core_commit }}
      inputs_sha256: ${{ needs.dependencies.outputs.sha256 }}
      matrix: ${{ needs.prepare.outputs.matrix }}
      stress: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

  verifier:
    name: Prepare archive verifier
    needs: [prepare, tools]
    if: needs.prepare.outputs.selected_count != '0' && !inputs.builder-diagnostics
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: sunder-agent-package
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sunder-agent-package
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Younics/sunder-core
          ref: ${{ needs.prepare.outputs.core_commit }}
          path: sunder-core
          persist-credentials: false
      - uses: ./sunder-agent-package/.github/actions/setup
        with:
          node: 'false'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-core-tools-linux-x64
          path: ${{ runner.temp }}/core-tools
      - run: python3 -B scripts/ci/agent_ci.py prepare-verifier --core ../sunder-core --tools "$RUNNER_TEMP/core-tools"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-package-test-binaries
          path: sunder-agent-package/artifacts/package-test-binaries
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: agent-verifier-results-${{ github.run_attempt }}
          path: sunder-agent-package/artifacts/verifier-results
          if-no-files-found: error

  source:
    name: ${{ inputs.builder-diagnostics && 'Builder diagnostics' || 'Shared family' }} · ${{ matrix.mode }} · ${{ matrix.rid }}
    needs: [prepare, dependencies, tools]
    if: needs.prepare.outputs.selected_count != '0' && (needs.prepare.outputs.full == 'true' || inputs.builder-diagnostics)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: bash
        working-directory: sunder-agent-package
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: sunder-agent-package
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Younics/sunder-core
          ref: ${{ needs.prepare.outputs.core_commit }}
          path: sunder-core
          persist-credentials: false
      - uses: ./sunder-agent-package/.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-core-tools-${{ matrix.rid }}
          path: ${{ runner.temp }}/core-tools
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-dependency-inputs
          path: ${{ runner.temp }}/agent-inputs
      - name: Verify shared dependency inputs
        id: inputs
        env:
          INPUTS_SHA256: ${{ needs.dependencies.outputs.sha256 }}
        run: |
          set -euo pipefail
          test "$(python3 -B scripts/release/agent_release.py file-sha "$RUNNER_TEMP/agent-inputs/cold-inputs.json")" = "$INPUTS_SHA256"
      - name: Run focused then full Builder diagnostics
        if: github.event_name == 'workflow_dispatch' && inputs.builder-diagnostics
        run: |
          python3 -B scripts/ci/agent_ci.py validate --core ../sunder-core \
            --inputs "$RUNNER_TEMP/agent-inputs" --tools "$RUNNER_TEMP/core-tools" --packages '["younics.sunder.package.maker"]' --builder-diagnostics
      - name: Build and test selected reference mode
        if: github.event_name != 'workflow_dispatch' || !inputs.builder-diagnostics
        env:
          MODE: ${{ matrix.mode }}
          PACKAGES: ${{ needs.prepare.outputs.packages }}
          STRESS: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          args=()
          [[ "$STRESS" != true ]] || args+=(--stress)
          python3 -B scripts/ci/agent_ci.py validate --core ../sunder-core \
            --inputs "$RUNNER_TEMP/agent-inputs" --tools "$RUNNER_TEMP/core-tools" --mode "$MODE" --shared "${args[@]}"
      - name: Retain CI reports
        if: always() && steps.inputs.outcome != 'skipped' && steps.inputs.outcome != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sunder-agent-shared-${{ matrix.mode }}-${{ matrix.platform }}-${{ github.run_attempt }}
          path: |
            sunder-agent-package/artifacts/reports
            sunder-agent-package/artifacts/test-results
            sunder-agent-package/artifacts/stress
            sunder-agent-package/artifacts/source-family
            sunder-agent-package/artifacts/source-commands
            sunder-agent-package/artifacts/builder-diagnostics
          if-no-files-found: error
          retention-days: 14

  summary:
    name: Summary
    if: always()
    needs: [prepare, preflight, dependency-discovery, tools, bootstrap, dependencies, components, verifier, source]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require all selected validation jobs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          BUILDER_DIAGNOSTICS: ${{ inputs.builder-diagnostics }}
        run: python3 -B scripts/ci/workflow_summary.py validate
