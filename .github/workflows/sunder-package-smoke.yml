# Diagnostic ref only. Never merge this replacement into the candidate.
name: Diagnose the two macOS shared-source failures
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact candidate SHA for the diagnostic test checkout
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  probe:
    name: ${{ matrix.profile }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: osx-arm64-memory, runner: macos-15}
          - {profile: osx-x64-owner, runner: macos-15-intel}
    defaults:
      run:
        shell: bash
        working-directory: sunder-agent-package
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate }}
          path: sunder-agent-package
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Younics/sunder-core
          ref: 5a51f2040634bfef166516b04342f5115fb1be6a
          path: sunder-core
          persist-credentials: false
      - uses: ./sunder-agent-package/.github/actions/setup
      - name: Run the affected boundary with tracing
        env:
          CANDIDATE: ${{ inputs.candidate }}
          PROFILE: ${{ matrix.profile }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -B ../diagnostic/scripts/test/diagnose-mac-shared-source.py "$PROFILE" "$CANDIDATE" "$RUNNER_TEMP/mac-source-diagnostics"
      - name: Retain reports and traces first
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-source-reports-${{ matrix.profile }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mac-source-diagnostics/evidence/
            !${{ runner.temp }}/mac-source-diagnostics/evidence/**/*.dmp
            !${{ runner.temp }}/mac-source-diagnostics/evidence/**/*.binlog
          if-no-files-found: error
          retention-days: 90
      - name: Retain build logs and mini dumps separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-source-process-evidence-${{ matrix.profile }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mac-source-diagnostics/evidence/**/*.binlog
            ${{ runner.temp }}/mac-source-diagnostics/evidence/**/*.dmp
          if-no-files-found: ignore
          retention-days: 14
