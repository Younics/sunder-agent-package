# Scoped verification ref only. These workflows must not be merged.
name: Verify repaired macOS shared-source boundaries
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact repaired Agent SHA
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  focused:
    name: Focused source · ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {rid: osx-arm64, runner: macos-15}
          - {rid: osx-x64, runner: macos-15-intel}
    uses: ./.github/workflows/diagnostic-mac-shared-recheck.yml
    with:
      candidate: ${{ inputs.candidate }}
      rid: ${{ matrix.rid }}
      runner: ${{ matrix.runner }}
      stage: focused
  shared:
    name: Shared source · ${{ matrix.rid }}
    needs: [focused]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {rid: osx-arm64, runner: macos-15}
          - {rid: osx-x64, runner: macos-15-intel}
    uses: ./.github/workflows/diagnostic-mac-shared-recheck.yml
    with:
      candidate: ${{ inputs.candidate }}
      rid: ${{ matrix.rid }}
      runner: ${{ matrix.runner }}
      stage: shared
