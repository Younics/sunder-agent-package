version: 2.1

orbs:
  win: circleci/windows@5.0

commands:
  install_dotnet_10:
    steps:
      - run:
          name: Install .NET 10 SDK
          command: |
            $ErrorActionPreference = "Stop"
            [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

            $installDir = "$env:USERPROFILE\.dotnet"
            $installScript = "$env:TEMP\dotnet-install.ps1"

            Invoke-WebRequest "https://dot.net/v1/dotnet-install.ps1" -UseBasicParsing -OutFile $installScript
            & $installScript -Version 10.0.100 -InstallDir $installDir -Architecture x64
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            $env:PATH = "$installDir;$installDir\tools;$env:PATH"
            dotnet --info
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

jobs:
  agent_package_build_test:
    parameters:
      sdk_mode:
        type: enum
        enum: ["package", "source"]
        default: "package"
    executor:
      name: win/default
      size: medium
    steps:
      - checkout
      - install_dotnet_10
      - when:
          condition:
            equal: ["source", << parameters.sdk_mode >>]
          steps:
            - run:
                name: Checkout Sunder source SDK
                command: |
                  $ErrorActionPreference = "Stop"
                  $sourceSdkPath = Join-Path (Split-Path -Parent (Get-Location).Path) "sunder-core"
                  git clone --depth 1 https://github.com/Younics/sunder-core.git $sourceSdkPath
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run:
          name: Build and test Agent packages (<< parameters.sdk_mode >> SDK)
          command: |
            $ErrorActionPreference = "Stop"
            $env:PATH = "$env:USERPROFILE\.dotnet;$env:USERPROFILE\.dotnet\tools;$env:PATH"

            function Invoke-Checked {
              param([scriptblock]$Command)

              & $Command
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }

            $useSourceSdk = if ("<< parameters.sdk_mode >>" -eq "source") { "true" } else { "false" }
            Invoke-Checked { dotnet restore ".\Sunder.AgentPackage.slnx" --force-evaluate "-p:SunderUseSourceSdk=$useSourceSdk" }
            Invoke-Checked { dotnet build ".\Sunder.AgentPackage.slnx" -c Release --no-restore "-p:SunderUseSourceSdk=$useSourceSdk" }

            New-Item -ItemType Directory -Force -Path ".\test-results" | Out-Null

            Invoke-Checked { dotnet test ".\Sunder.AgentPackage.slnx" -c Release --no-build --no-restore "-p:SunderUseSourceSdk=$useSourceSdk" --logger "trx" --results-directory ".\test-results" }
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results

workflows:
  sunder_agent_package:
    jobs:
      - agent_package_build_test:
          name: agent-package-<< matrix.sdk_mode >>
          matrix:
            parameters:
              sdk_mode: ["package", "source"]
